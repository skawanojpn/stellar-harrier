<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>STELLAR HARRIER</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        font-family: "Courier New", monospace;
        /* body側にtouch-actionが指定されていないと、ブラウザがタッチを
           スクロール/ズームジェスチャーの候補として解釈し続けることが
           あり、1回目のタッチ後に以降の入力がスクロール扱いになる
           現象につながる。html/body両方に明示することで確実に防ぐ。 */
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #canvas-container {
        position: relative;
        width: 100vw;
        height: 100vh;
        /* スマホでタッチ操作(ドラッグ/タップ)を確実にpointerイベントへ
           渡すため、ブラウザ標準のスクロール/ピンチズーム/ダブルタップ
           ズームジェスチャー解釈を無効化する。これがないと、モバイル
           ブラウザがタッチをスクロール候補として先に処理しようとし、
           pointerdown/pointermoveが遅延・キャンセルされることがある。 */
        touch-action: none;
      }
      #canvas-container canvas {
        display: block;
        touch-action: none;
      }
      #hud {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        padding: 12px 20px;
        box-sizing: border-box;
        display: flex;
        justify-content: space-between;
        color: #ffcc00;
        text-shadow: 0 0 6px rgba(255, 150, 0, 0.8);
        font-size: 22px;
        /* HUDは画面上部を横断する透明な帯だが、テキスト表示のみで操作対象
           ではないため、タッチ/クリックを下のcanvasへ透過させる。これが
           ないと画面上部でのタッチ操作が吸収されてしまう。 */
        pointer-events: none;
        font-weight: bold;
        pointer-events: none;
        z-index: 10;
      }
      #stage-banner {
        position: absolute;
        top: 45%;
        left: 0;
        width: 100%;
        text-align: center;
        color: #fff;
        text-shadow: 0 0 12px rgba(255, 255, 255, 0.9);
        font-size: 36px;
        font-weight: bold;
        letter-spacing: 6px;
        z-index: 15;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.4s ease;
      }
      #stage-banner.visible {
        opacity: 1;
      }
      #boss-warning {
        position: absolute;
        top: 38%;
        left: 0;
        width: 100%;
        text-align: center;
        z-index: 20;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.15s ease;
      }
      #boss-warning.visible {
        opacity: 1;
        animation: boss-warning-flash 0.3s step-start infinite;
      }
      #boss-warning-label {
        color: #ff3333;
        text-shadow:
          0 0 16px rgba(255, 51, 51, 0.9),
          0 0 4px #fff;
        font-size: 26px;
        font-weight: bold;
        letter-spacing: 8px;
      }
      #boss-warning-name {
        color: #fff;
        text-shadow:
          0 0 20px rgba(255, 68, 34, 0.9),
          0 0 6px #ff8844;
        font-size: 52px;
        font-weight: bold;
        letter-spacing: 4px;
        margin-top: 4px;
      }
      @keyframes boss-warning-flash {
        50% {
          opacity: 0.35;
        }
      }
      #boss-hp-container {
        position: absolute;
        top: 56px;
        left: 50%;
        transform: translateX(-50%);
        width: 50%;
        max-width: 480px;
        z-index: 10;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.3s ease;
      }
      #boss-hp-container.visible {
        opacity: 1;
      }
      #boss-hp-label {
        color: #ff4444;
        text-shadow: 0 0 6px rgba(255, 0, 0, 0.8);
        font-size: 14px;
        font-weight: bold;
        letter-spacing: 2px;
        margin-bottom: 4px;
        text-align: center;
      }
      #boss-hp-bar-outer {
        width: 100%;
        height: 14px;
        border: 2px solid #ff4444;
        border-radius: 3px;
        background: rgba(0, 0, 0, 0.5);
        box-sizing: border-box;
      }
      #boss-hp-bar-inner {
        height: 100%;
        width: 100%;
        background: linear-gradient(90deg, #ff2222, #ff8800);
        transition: width 0.15s ease;
      }
      #message-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #ffcc00;
        text-shadow: 0 0 10px rgba(255, 150, 0, 0.9);
        z-index: 20;
        background: rgba(0, 0, 0, 0.55);
      }
      #message-overlay.hidden {
        display: none;
      }
      #message-overlay h1 {
        font-size: 42px;
        letter-spacing: 4px;
        margin: 0 0 16px;
        text-align: center;
        animation: title-glow 1.8s ease-in-out infinite;
      }
      @keyframes title-glow {
        0%,
        100% {
          text-shadow:
            0 0 10px rgba(255, 150, 0, 0.9),
            0 0 20px rgba(255, 100, 0, 0.4);
        }
        50% {
          text-shadow:
            0 0 20px rgba(255, 200, 0, 1),
            0 0 40px rgba(255, 150, 0, 0.8);
        }
      }
      #message-overlay p {
        font-size: 16px;
        margin: 4px 0;
        text-align: center;
      }
      #message-overlay p.stats-summary {
        font-size: 12px;
        color: #aaccff;
        opacity: 0.85;
        margin-top: 8px;
        line-height: 1.6;
      }
      #high-score-display {
        font-size: 20px;
        color: #66ddff;
        text-shadow: 0 0 8px rgba(100, 200, 255, 0.8);
        margin: 4px 0 12px;
        font-weight: bold;
      }
      #combo-display {
        position: absolute;
        top: 90px;
        left: 50%;
        transform: translateX(-50%);
        color: #ffee44;
        text-shadow: 0 0 10px rgba(255, 230, 0, 0.9);
        font-size: 20px;
        font-weight: bold;
        letter-spacing: 2px;
        z-index: 10;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.15s ease;
      }
      #combo-display.visible {
        opacity: 1;
      }
      #message-overlay button {
        margin-top: 24px;
        padding: 10px 28px;
        font-size: 18px;
        font-family: inherit;
        font-weight: bold;
        background: #ffcc00;
        color: #000;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      #mute-button {
        position: absolute;
        bottom: 16px;
        right: 16px;
        z-index: 25;
        background: rgba(0, 0, 0, 0.5);
        color: #ffcc00;
        border: 1px solid #ffcc00;
        border-radius: 4px;
        padding: 6px 12px;
        font-family: inherit;
        cursor: pointer;
      }
      #pause-button {
        position: absolute;
        bottom: 16px;
        right: 110px;
        z-index: 25;
        background: rgba(0, 0, 0, 0.5);
        color: #ffcc00;
        border: 1px solid #ffcc00;
        border-radius: 4px;
        padding: 6px 12px;
        font-family: inherit;
        cursor: pointer;
      }
      #flash-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #fff;
        opacity: 0;
        pointer-events: none;
        z-index: 30;
      }
      #pause-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #ffcc00;
        text-shadow: 0 0 10px rgba(255, 150, 0, 0.9);
        z-index: 26;
        background: rgba(0, 0, 0, 0.7);
      }
      #pause-overlay.hidden {
        display: none;
      }
      #pause-overlay h1 {
        font-size: 36px;
        letter-spacing: 6px;
        margin: 0 0 8px;
      }
      #pause-overlay p {
        font-size: 14px;
        opacity: 0.8;
      }
      #pause-overlay button {
        margin-top: 20px;
        padding: 8px 24px;
        font-size: 15px;
        font-family: inherit;
        font-weight: bold;
        background: #ffcc00;
        color: #000;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      #stage-select-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #ffcc00;
        text-shadow: 0 0 10px rgba(255, 150, 0, 0.9);
        z-index: 27;
        background: rgba(0, 0, 0, 0.85);
      }
      #stage-select-overlay.hidden {
        display: none;
      }
      #stage-select-overlay h1 {
        font-size: 28px;
        letter-spacing: 4px;
        margin: 0 0 6px;
      }
      #stage-select-overlay p {
        font-size: 13px;
        opacity: 0.75;
        margin: 0 0 20px;
      }
      #stage-select-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .stage-select-item {
        font-size: 20px;
        padding: 8px 32px;
        border: 2px solid transparent;
        border-radius: 4px;
        cursor: pointer;
        text-align: center;
      }
      .stage-select-item.selected {
        border-color: #ffcc00;
        background: rgba(255, 204, 0, 0.15);
      }
      #stage-select-tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
      }
      .stage-select-tab {
        font-size: 14px;
        padding: 6px 20px;
        border: 2px solid #665500;
        border-radius: 4px;
        cursor: pointer;
        color: #ffcc00;
        opacity: 0.6;
        background: transparent;
        font-family: inherit;
      }
      .stage-select-tab.active {
        opacity: 1;
        border-color: #ffcc00;
        background: rgba(255, 204, 0, 0.15);
      }
      .score-popup {
        position: absolute;
        color: #ffee44;
        text-shadow: 0 0 8px rgba(255, 230, 0, 0.9);
        font-size: 18px;
        font-weight: bold;
        pointer-events: none;
        z-index: 12;
        transform: translate(-50%, -50%);
        animation: score-popup-rise 1s ease-out forwards;
      }
      .score-popup.boss-defeat {
        font-size: 28px;
        color: #ff6644;
        text-shadow: 0 0 12px rgba(255, 100, 0, 1);
      }
      @keyframes score-popup-rise {
        0% {
          opacity: 1;
          transform: translate(-50%, -50%);
        }
        100% {
          opacity: 0;
          transform: translate(-50%, -150%);
        }
      }
    </style>
  </head>
  <body>
    <div id="canvas-container">
      <div id="hud">
        <span id="score-display">SCORE: 0</span>
        <span id="stage-display">STAGE 1: FANTASY ZONE</span>
        <span id="lives-display">LIVES: 3</span>
      </div>
      <div id="stage-banner"></div>
      <div id="boss-warning">
        <div id="boss-warning-label">WARNING</div>
        <div id="boss-warning-name"></div>
      </div>
      <div id="boss-hp-container">
        <div id="boss-hp-label">BOSS</div>
        <div id="boss-hp-bar-outer"><div id="boss-hp-bar-inner"></div></div>
      </div>
      <div id="combo-display"></div>
      <div id="flash-overlay"></div>
      <div id="pause-overlay" class="hidden">
        <h1>PAUSED</h1>
        <p>Pキーで再開</p>
        <button id="pause-quit-button" type="button">QUIT TO TITLE</button>
      </div>
      <div id="stage-select-overlay" class="hidden">
        <h1 id="stage-select-title">STAGE SELECT</h1>
        <p>↑↓で選択、スペース/クリックで決定、Escでキャンセル、←→でタブ切替</p>
        <div id="stage-select-tabs">
          <button
            class="stage-select-tab active"
            type="button"
            data-tab="stage"
          >
            STAGE
          </button>
          <button class="stage-select-tab" type="button" data-tab="boss">
            BOSS TEST
          </button>
          <button class="stage-select-tab" type="button" data-tab="ending">
            ENDING
          </button>
        </div>
        <div id="stage-select-list"></div>
      </div>
      <button id="pause-button" type="button">PAUSE</button>
      <button id="mute-button" type="button">SOUND: ON</button>
      <div id="message-overlay">
        <h1>STELLAR HARRIER</h1>
        <div id="high-score-display">HIGH SCORE: 0</div>
        <p>移動: [矢印キー] or [WASD] or [テンキー] or [マウスドラッグ]</p>
        <p>ショット: [スペースキー] or [マウスクリック]</p>
        <button id="start-button" type="button">START</button>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"
      integrity="sha384-qOkzR5Ke/XkQxuGVJ9hpFEpDlcoLtWwVYhnJf06cLIZa2vaIptSqaubivErzmD5O"
      crossorigin="anonymous"
    ></script>
    <script>
      (function () {
        "use strict";

        // ============================================================
        // 純粋ロジック (src/game/*.ts と同じ考え方をブラウザ実行用に複製)
        // ============================================================

        function clampPosition(pos, bounds) {
          return {
            x: Math.min(Math.max(pos.x, bounds.minX), bounds.maxX),
            y: Math.min(Math.max(pos.y, bounds.minY), bounds.maxY),
          };
        }

        // FORMATION_INTERVAL回に1回、通常の単騎出現の代わりに3機編隊
        // (原作のスペースハリアーらしい横一列の編隊美)を出現させる。
        var FORMATION_INTERVAL = 5;
        var FORMATION_OFFSETS = [-2.5, 0, 2.5];

        function generateSpawnSchedule(
          durationSeconds,
          intervalSeconds,
          bossAtSeconds,
          domEnabled,
          tomosEnabled,
        ) {
          var lanes = [-6, -3, 0, 3, 6];
          var kinds = ["grunt", "grunt", "shooter", "dasher", "weaver"];
          if (domEnabled) kinds.push("dom");
          if (tomosEnabled) kinds.push("tomos");
          var events = [];
          var index = 0;
          for (
            var t = intervalSeconds;
            t < durationSeconds;
            t += intervalSeconds
          ) {
            var kind = kinds[index % kinds.length];
            var laneX = lanes[index % lanes.length];
            var isFormation =
              index > 0 &&
              index % FORMATION_INTERVAL === 0 &&
              (kind === "grunt" || kind === "shooter");
            if (isFormation) {
              for (var fi = 0; fi < FORMATION_OFFSETS.length; fi++) {
                events.push({
                  time: t,
                  kind: kind,
                  laneX: laneX + FORMATION_OFFSETS[fi],
                });
              }
            } else {
              events.push({ time: t, kind: kind, laneX: laneX });
            }
            index += 1;
          }
          if (bossAtSeconds !== undefined) {
            events.push({ time: bossAtSeconds, kind: "boss", laneX: 0 });
          }
          events.sort(function (a, b) {
            return a.time - b.time;
          });
          return events;
        }

        function createPrng(seed) {
          var state = seed % 2147483647;
          if (state <= 0) state += 2147483646;
          return function () {
            state = (state * 16807) % 2147483647;
            return (state - 1) / 2147483646;
          };
        }

        var OBSTACLE_KINDS = ["pillar", "rock", "ruins", "floating_island"];

        function generateObstacleSchedule(
          durationSeconds,
          intervalSeconds,
          seed,
        ) {
          var lanes = [-8, -4, 4, 8];
          var random = createPrng(seed);
          var events = [];
          for (
            var t = intervalSeconds;
            t < durationSeconds;
            t += intervalSeconds
          ) {
            var laneIndex = Math.floor(random() * lanes.length);
            var kindIndex = Math.floor(random() * OBSTACLE_KINDS.length);
            events.push({
              time: t,
              laneX: lanes[laneIndex],
              kind: OBSTACLE_KINDS[kindIndex],
            });
          }
          return events;
        }

        function scoreForEnemy(kind) {
          if (kind === "grunt") return 100;
          if (kind === "shooter") return 200;
          if (kind === "dasher") return 150;
          if (kind === "weaver") return 250;
          if (kind === "dom") return 400;
          return 5000;
        }

        function circlesIntersect(a, b) {
          var dx = a.x - b.x;
          var dy = a.y - b.y;
          var distSq = dx * dx + dy * dy;
          var r = a.radius + b.radius;
          return distSq <= r * r;
        }

        var STAGES = [
          {
            id: 1,
            name: "FANTASY ZONE",
            durationSeconds: 60,
            spawnIntervalSeconds: 2.2,
            obstacleIntervalSeconds: 4,
            bossAtSeconds: 55,
            groundColor: 0xff2266,
            skyColorTop: 0x220044,
            skyColorBottom: 0x662299,
            enemySpeedMultiplier: 1,
            bossType: "scaler",
            bossName: "SCALER",
            domEnabled: false,
            tomosEnabled: false,
          },
          {
            id: 2,
            name: "CRYSTAL CANYON",
            durationSeconds: 65,
            spawnIntervalSeconds: 1.9,
            obstacleIntervalSeconds: 3.5,
            bossAtSeconds: 60,
            // 結晶の谷: FROZEN NEBULA(氷/水色)と混同しないよう、紫〜
            // マゼンタを基調にした幻想的な結晶色にする。
            groundColor: 0xaa55ff,
            skyColorTop: 0x1a0033,
            skyColorBottom: 0x6622aa,
            enemySpeedMultiplier: 1.1,
            bossType: "godani",
            bossName: "GODANI",
            domEnabled: true,
            tomosEnabled: false,
          },
          {
            id: 3,
            name: "FROZEN NEBULA",
            durationSeconds: 68,
            spawnIntervalSeconds: 1.8,
            obstacleIntervalSeconds: 3.3,
            bossAtSeconds: 62,
            groundColor: 0x88ddff,
            skyColorTop: 0x001a33,
            skyColorBottom: 0x2266aa,
            enemySpeedMultiplier: 1.18,
            bossType: "tomos",
            bossName: "TOMOS",
            domEnabled: true,
            tomosEnabled: true,
          },
          {
            id: 4,
            name: "INFERNO CORE",
            durationSeconds: 72,
            spawnIntervalSeconds: 1.6,
            obstacleIntervalSeconds: 3,
            bossAtSeconds: 65,
            groundColor: 0xff6600,
            skyColorTop: 0x220000,
            skyColorBottom: 0x881100,
            enemySpeedMultiplier: 1.25,
            bossType: "sarpedon",
            bossName: "JET STREAM DOMS",
            domEnabled: true,
            tomosEnabled: true,
          },
          {
            id: 5,
            name: "VOID GARDEN",
            durationSeconds: 75,
            spawnIntervalSeconds: 1.5,
            obstacleIntervalSeconds: 2.8,
            bossAtSeconds: 68,
            groundColor: 0x99ff66,
            skyColorTop: 0x0a1a00,
            skyColorBottom: 0x335500,
            enemySpeedMultiplier: 1.35,
            bossType: "barbarian",
            bossName: "MOAI",
            domEnabled: true,
            tomosEnabled: true,
          },
          {
            id: 6,
            name: "HALL OF LEGENDS",
            durationSeconds: 20,
            spawnIntervalSeconds: 2.5,
            obstacleIntervalSeconds: 5,
            // このステージはボスラッシュ専用(bossAtSecondsによる単発出現は
            // 使わず、bossSequenceで指定した順にボスを1体ずつ連戦させる)。
            bossAtSeconds: undefined,
            bossSequence: [
              "scaler",
              "godani",
              "tomos",
              "sarpedon",
              "barbarian",
            ],
            groundColor: 0x9955ff,
            skyColorTop: 0x0a0022,
            skyColorBottom: 0x440066,
            enemySpeedMultiplier: 1.4,
            bossType: "generic",
            bossName: "BOSS RUSH",
            domEnabled: false,
            tomosEnabled: false,
          },
          {
            id: 7,
            name: "ABSYMBEL",
            durationSeconds: 90,
            spawnIntervalSeconds: 1.3,
            obstacleIntervalSeconds: 2.5,
            bossAtSeconds: 80,
            groundColor: 0xffcc00,
            skyColorTop: 0x1a0011,
            skyColorBottom: 0x550022,
            enemySpeedMultiplier: 1.5,
            bossType: "final",
            bossName: "ABSYMBEL",
            domEnabled: true,
            tomosEnabled: true,
          },
        ];

        function getStageConfig(stageId) {
          for (var i = 0; i < STAGES.length; i++) {
            if (STAGES[i].id === stageId) return STAGES[i];
          }
          throw new Error("存在しないstageIdです: " + stageId);
        }

        function nextStageId(currentStageId) {
          for (var i = 0; i < STAGES.length; i++) {
            if (STAGES[i].id === currentStageId + 1) return STAGES[i].id;
          }
          return null;
        }

        // ============================================================
        // サウンド (Web Audio API によるチップチューン風 SE/BGM 生成)
        // ============================================================

        var AudioCtx = window.AudioContext || window.webkitAudioContext;
        var audioCtx = null;
        var soundEnabled = true;
        var bgmGain = null;
        var bgmTimer = null;
        var bgmStep = 0;

        function ensureAudio() {
          if (!audioCtx && AudioCtx) {
            audioCtx = new AudioCtx();
          }
          return audioCtx;
        }

        // BGM再生用のマスターGainNode。BGMのすべての音はこのノードを経由
        // させることで、stopBgmAndSilence()時に一括かつ即座に無音化できる
        // (setIntervalを止めただけでは、既に発音中の個々のOscillatorNode
        // は自然減衰が終わるまで鳴り続けてしまうため)。
        function ensureBgmGain(ctx) {
          if (!bgmGain) {
            bgmGain = ctx.createGain();
            bgmGain.gain.value = 1;
            bgmGain.connect(ctx.destination);
          }
          return bgmGain;
        }

        function playTone(freq, duration, type, volume, destinationNode) {
          if (!soundEnabled) return;
          var ctx = ensureAudio();
          if (!ctx) return;
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          osc.type = type || "square";
          osc.frequency.value = freq;
          gain.gain.value = volume !== undefined ? volume : 0.15;
          gain.gain.exponentialRampToValueAtTime(
            0.001,
            ctx.currentTime + duration,

        function createGroundTexture(baseColorHex) {
          var size = 256;
          var canvas = document.createElement("canvas");
          canvas.width = size;
          canvas.height = size;
          var ctx = canvas.getContext("2d");
          var baseColor = new THREE.Color(baseColorHex);
          var r = Math.floor(baseColor.r * 255);
          var g = Math.floor(baseColor.g * 255);
          var b = Math.floor(baseColor.b * 255);
          ctx.fillStyle =
            "rgb(" +
            Math.floor(r * 0.25) +
            "," +
            Math.floor(g * 0.25) +
            "," +
            Math.floor(b * 0.25) +
            ")";
          ctx.fillRect(0, 0, size, size);

          var cell = 32;
          for (var y = 0; y < size; y += cell) {
            for (var x = 0; x < size; x += cell) {
              var isAlt = (x / cell + y / cell) % 2 === 0;
              ctx.fillStyle = isAlt
                ? "rgb(" + r + "," + g + "," + b + ")"
                : "rgb(" +
                  Math.floor(r * 0.55) +
                  "," +
                  Math.floor(g * 0.55) +
                  "," +
                  Math.floor(b * 0.55) +
                  ")";
              ctx.fillRect(x, y, cell, cell);
            }
          }
          ctx.strokeStyle = "rgba(255,255,255,0.15)";
          ctx.lineWidth = 2;
          for (var lx = 0; lx <= size; lx += cell) {
            ctx.beginPath();
            ctx.moveTo(lx, 0);
            ctx.lineTo(lx, size);
            ctx.stroke();
          }
          for (var ly = 0; ly <= size; ly += cell) {
            ctx.beginPath();
            ctx.moveTo(0, ly);
            ctx.lineTo(size, ly);
            ctx.stroke();
          }

          var texture = new THREE.CanvasTexture(canvas);
          texture.wrapS = THREE.RepeatWrapping;
          texture.wrapT = THREE.RepeatWrapping;
          texture.repeat.set(16, 30);
          return texture;
        }

        function buildSky(stage) {
          if (skyMesh) {
            scene.remove(skyMesh);
          }
          var size = 128;
          var canvas = document.createElement("canvas");
          canvas.width = 2;
          canvas.height = size;
          var ctx = canvas.getContext("2d");
          var gradient = ctx.createLinearGradient(0, 0, 0, size);
          gradient.addColorStop(
            0,
            "#" + new THREE.Color(stage.skyColorTop).getHexString(),
          );
          gradient.addColorStop(
            1,
            "#" + new THREE.Color(stage.skyColorBottom).getHexString(),
          );
          ctx.fillStyle = gradient;
          ctx.fillRect(0, 0, 2, size);
          var texture = new THREE.CanvasTexture(canvas);

          skyMesh = new THREE.Mesh(
            new THREE.SphereGeometry(280, 24, 16),
            new THREE.MeshBasicMaterial({
              map: texture,
              side: THREE.BackSide,
              fog: false,
            }),
          );
          scene.add(skyMesh);
        }

        function buildStars() {
          var starCount = 400;
          var positions = new Float32Array(starCount * 3);
          for (var i = 0; i < starCount; i++) {
            var radius = 150 + Math.random() * 100;
            var theta = Math.random() * Math.PI * 2;
            var phi = Math.random() * Math.PI * 0.5;
            positions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
            positions[i * 3 + 1] = Math.abs(radius * Math.cos(phi)) * 0.6 + 10;
            positions[i * 3 + 2] =
              radius * Math.sin(phi) * Math.sin(theta) - 60;
          }
          var geo = new THREE.BufferGeometry();
          geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
          var mat = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 1.2,
            sizeAttenuation: true,
          });
          starField = new THREE.Points(geo, mat);
          scene.add(starField);
        }

        function buildGround(stage) {
          if (groundMesh) {
            scene.remove(groundMesh);
          }
          var texture = createGroundTexture(stage.groundColor);
          var groundGeo = new THREE.PlaneGeometry(240, 400, 4, 60);
          var groundMat = new THREE.MeshBasicMaterial({
            map: texture,
            fog: true,
          });
          groundMesh = new THREE.Mesh(groundGeo, groundMat);
          groundMesh.rotation.x = -Math.PI / 2;
          groundMesh.position.y = -4;
          groundMesh.position.z = -120;
          groundMesh.name = "ground";
          scene.add(groundMesh);
        }

        function init() {
          scene = new THREE.Scene();
          scene.fog = new THREE.Fog(0x1a0033, 50, 220);

          camera = new THREE.PerspectiveCamera(

            .getElementById("canvas-container")
            .appendChild(renderer.domElement);

          var ambient = new THREE.AmbientLight(0x8888aa, 0.9);
          scene.add(ambient);
          var sun = new THREE.DirectionalLight(0xffddaa, 0.8);
          sun.position.set(10, 30, 10);
          scene.add(sun);

          buildSky(STAGES[0]);
          buildStars();
          buildGround(STAGES[0]);

          playerGroup = new THREE.Group();
          var playerGeo = new THREE.ConeGeometry(0.6, 1.6, 6);
          var playerMat = new THREE.MeshStandardMaterial({
            color: 0x33ccff,

          });
          player = new THREE.Mesh(playerGeo, playerMat);
          player.rotation.x = Math.PI / 2;
          playerGroup.add(player);
          playerGroup.position.set(0, 0, 2);
          scene.add(playerGroup);

          playerLight = new THREE.PointLight(0x66ccff, 1.2, 10);
          playerGroup.add(playerLight);

          var shieldGeo = new THREE.SphereGeometry(1.1, 12, 10);
          var shieldMat = new THREE.MeshBasicMaterial({
            color: 0x66ddff,
            transparent: true,
            opacity: 0.35,
            wireframe: true,
          });
          shieldMesh = new THREE.Mesh(shieldGeo, shieldMat);
          shieldMesh.visible = false;
          playerGroup.add(shieldMesh);

          window.addEventListener("resize", onResize);
          window.addEventListener("keydown", onKeyDown);
          window.addEventListener("keyup", onKeyUp);
          renderer.domElement.addEventListener("pointerdown", onPointerDown);
          renderer.domElement.addEventListener("pointermove", onPointerMove);
          window.addEventListener("pointerup", onPointerUp);
          // GASのWebアプリはサンドボックス化されたiframe内で配信されるため、
          // 環境によってはPointer Events APIのタッチ由来イベントが正しく
          // 発火しないことがある。より互換性の高いTouch Events APIも
          // 併用し、どちらか一方でも操作を拾えるようにする。
          // {passive:false}+preventDefault()でスクロール等のデフォルト
          // 挙動を止める。
          renderer.domElement.addEventListener("touchstart", onTouchStart, {
            passive: false,
          });
          renderer.domElement.addEventListener("touchmove", onTouchMove, {
            passive: false,
          });
          renderer.domElement.addEventListener("touchend", onTouchEnd, {
            passive: false,
          });
          renderer.domElement.addEventListener("touchcancel", onTouchEnd, {
            passive: false,
          });

          document.getElementById("start-button").onclick = startGame;
          document.getElementById("mute-button").onclick = toggleSound;
          document.getElementById("pause-button").onclick = togglePause;

          document
            .querySelectorAll(".stage-select-tab")
            .forEach(function (tab) {
              tab.onclick = function () {
                switchStageSelectTab(tab.getAttribute("data-tab"));
              };
            });

          refreshHighScoreDisplay();
          requestAnimationFrame(loop);
        }

        function onResize() {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function onKeyDown(e) {
          keys[e.code] = true;

          if (state === STATE_STAGE_SELECT) {
            handleStageSelectKey(e.code);
            return;
          }

          if (e.code === "Space" && state === STATE_PLAYING) {
            fireBullet();
          }
          if (e.code === "Space" && state === STATE_READY) {
            startGame();
          }
          if (
            e.code === "Space" &&
            state === STATE_GAMEOVER &&
            gameOverInputLockTimer <= 0
          ) {
            startGame();
          }
          if (
            e.code === "KeyP" &&
            (state === STATE_PLAYING || state === STATE_PAUSED)
          ) {
            togglePause();
          }
          if (e.code === "KeyQ" && state === STATE_PAUSED) {
            quitToTitle();
          }

          if (state === STATE_READY) {
            updateSecretCodeProgress(e.code);
          }
          if (state === STATE_PLAYING || state === STATE_GAMEOVER) {
            updateKonamiCodeProgress(e.code);
          }
        }

        function updateSecretCodeProgress(code) {
          if (code === SECRET_CODE[secretCodeProgress]) {
            secretCodeProgress += 1;
            if (secretCodeProgress === SECRET_CODE.length) {
              secretCodeProgress = 0;
              openStageSelect();
            }
          } else {
            secretCodeProgress = code === SECRET_CODE[0] ? 1 : 0;
          }
        }

        function updateKonamiCodeProgress(code) {
          if (code === KONAMI_CODE[konamiCodeProgress]) {
            konamiCodeProgress += 1;
            if (konamiCodeProgress === KONAMI_CODE.length) {
              konamiCodeProgress = 0;
              if (state === STATE_PLAYING) {
                activateInvincibleMode();
              } else if (state === STATE_GAMEOVER) {
                resumeFromGameOver();
              }
            }
          } else {
            konamiCodeProgress = code === KONAMI_CODE[0] ? 1 : 0;
          }
        }

        // プレイ中にコナミコマンドを入力すると、ステージクリアまで
        // 無敵になる(damagePlayer側でinvincibleModeActiveを見て被弾を
        // 無効化する)。ステージクリア(loadStage)のタイミングで解除する。
        function activateInvincibleMode() {
          invincibleModeActive = true;
          showStageBanner("INVINCIBLE MODE!");
        }

        // ゲームオーバー画面でコナミコマンドを入力すると、LIVESを3に戻し、
        // ゲームオーバーになった場面(現在のステージ・敵配置の進行度)から
        // 再開する。スコアは0にリセットする(ハイスコアへの不正な積み増し
        // を防ぐため)。
        function resumeFromGameOver() {
          lives = 3;
          score = 0;
          invulnerableTimer = 2;
          gameOverInputLockTimer = 0;
          gameOverAutoReturnTimer = 0;
          invincibleModeActive = false;
          cameraShake = 0;
          resetCombo();
          // ゲームオーバー時点で画面に残っていた敵弾・障害物は復帰後に
          // そのまま理不尽な被弾源になりうるため、敵(ボス含む)は残しつつ
          // それ以外はクリアしてから再開する。
          clearGroup(enemyBullets);
          clearGroup(obstacles);
          stopBgmAndSilence();
          var liveBoss = enemies.find(function (en) {
            return en.kind === "boss";
          });
          startBgm(liveBoss ? "boss" : "stage" + currentStage.id);
          if (liveBoss) {
            showBossHpBar(BOSS_NAME_BY_TYPE[liveBoss.bossType] || "BOSS");
            updateBossHpBar(liveBoss);
          }
          document.getElementById("message-overlay").classList.add("hidden");
          updateHud();
          state = STATE_PLAYING;
        }

        function openStageSelect() {
          stateBeforeStageSelect = state;
          state = STATE_STAGE_SELECT;
          selectedStageIndex = 0;
          stageSelectTab = "stage";
          stopBgm();
          renderStageSelectTabs();
          renderStageSelectList();
          document
            .getElementById("stage-select-overlay")
            .classList.remove("hidden");
        }

        function closeStageSelect() {
          state = stateBeforeStageSelect;
          document
            .getElementById("stage-select-overlay")
            .classList.add("hidden");
        }

        function currentStageSelectEntries() {
          if (stageSelectTab === "boss") return BOSS_TEST_ENTRIES;
          if (stageSelectTab === "ending") return ENDING_ENTRIES;
          return STAGES;
        }

        function stageSelectItemLabel(entry) {
          if (stageSelectTab === "boss") {
            return "BOSS: " + BOSS_NAME_BY_TYPE[entry.bossType];
          }
          if (stageSelectTab === "ending") {
            return entry.label;
          }
          return "STAGE " + entry.id + ": " + entry.name;
        }

        function renderStageSelectTabs() {
          var tabs = document.querySelectorAll(".stage-select-tab");
          tabs.forEach(function (tab) {
            tab.classList.toggle(
              "active",
              tab.getAttribute("data-tab") === stageSelectTab,
            );
          });
          document.getElementById("stage-select-title").textContent =
            stageSelectTab === "boss"
              ? "BOSS TEST SELECT"
              : stageSelectTab === "ending"
                ? "ENDING SELECT"
                : "STAGE SELECT";
        }

        function switchStageSelectTab(tab) {
          if (stageSelectTab === tab) return;
          stageSelectTab = tab;
          selectedStageIndex = 0;
          renderStageSelectTabs();
          renderStageSelectList();
        }

        function renderStageSelectList() {
          var list = document.getElementById("stage-select-list");
          list.innerHTML = "";
          var entries = currentStageSelectEntries();
          for (var i = 0; i < entries.length; i++) {
            var entry = entries[i];
            var item = document.createElement("div");
            item.className =
              "stage-select-item" +
              (i === selectedStageIndex ? " selected" : "");
            item.textContent = stageSelectItemLabel(entry);
            item.onclick = (function (index) {
              return function () {
                selectedStageIndex = index;
                confirmStageSelectEntry();
              };
            })(i);
            list.appendChild(item);
          }
        }

        // タブの巡回順序(←→キーでの切替に使う)。
        var STAGE_SELECT_TAB_ORDER = ["stage", "boss", "ending"];

        function confirmStageSelectEntry() {
          var entries = currentStageSelectEntries();
          var entry = entries[selectedStageIndex];
          if (stageSelectTab === "boss") {
            startBossTestMode(entry.bossType, entry.stageId);
          } else if (stageSelectTab === "ending") {
            startEndingPreview();
          } else {
            startGameAtStage(entry.id);
          }
        }

        // ステージ選択のENDINGタブから、最終ボス撃破直後のエンディング
        // 演出を単体で確認する。通常プレイと同じくプレイヤー状態を
        // 一旦リセットしてからエンディングシーケンスを開始する。
        function startEndingPreview() {
          resetPlayerRunState();
          bossTestModeActive = false;
          document.getElementById("message-overlay").classList.add("hidden");
          startEndingSequence();
        }

        function handleStageSelectKey(code) {
          var entries = currentStageSelectEntries();
          if (code === "ArrowUp") {
            selectedStageIndex =
              (selectedStageIndex - 1 + entries.length) % entries.length;
            renderStageSelectList();
          } else if (code === "ArrowDown") {
            selectedStageIndex = (selectedStageIndex + 1) % entries.length;
            renderStageSelectList();
          } else if (code === "ArrowLeft" || code === "ArrowRight") {
            var currentIndex = STAGE_SELECT_TAB_ORDER.indexOf(stageSelectTab);
            var delta = code === "ArrowLeft" ? -1 : 1;
            var nextIndex =
              (currentIndex + delta + STAGE_SELECT_TAB_ORDER.length) %
              STAGE_SELECT_TAB_ORDER.length;
            switchStageSelectTab(STAGE_SELECT_TAB_ORDER[nextIndex]);
          } else if (code === "Space" || code === "Enter") {
            confirmStageSelectEntry();
          } else if (code === "Escape") {
            closeStageSelect();
          }
        }

        function togglePause() {
          if (state === STATE_PLAYING) {
            statePriorToPause = state;
            state = STATE_PAUSED;
            stopBgm();
            document.getElementById("pause-overlay").classList.remove("hidden");
          } else if (state === STATE_PAUSED) {
            state = statePriorToPause;
            startBgm();
            document.getElementById("pause-overlay").classList.add("hidden");
          }
        }

        // ポーズ画面のQUIT TO TITLEボタン。BOSS TESTモードのように
        // 自然に終わらないプレイ中の状態から、タイトル画面へ強制的に
        // 抜けるための出口。
        function quitToTitle() {
          bossTestModeActive = false;
          state = STATE_READY;
          stopBgmAndSilence();
          hideBossHpBar();
          clearGroup(enemies);
          clearGroup(bullets);
          clearGroup(enemyBullets);
          clearGroup(explosions);
          clearGroup(obstacles);
          pendingBossSpawns = [];
          stageTransitionTimer = 0;
          stageTransitionNextId = null;
          invincibleModeActive = false;
          document.getElementById("boss-warning").classList.remove("visible");
          document.getElementById("pause-overlay").classList.add("hidden");
          document.getElementById("message-overlay").classList.remove("hidden");
          renderTitleScreen();
        }

        function onKeyUp(e) {
          keys[e.code] = false;
        }

        // GASのサンドボックス化されたiframe環境ではPointer Events APIの
        // タッチ由来イベントが発火しないことがあるため、Touch Events API
        // も並行して使う。一度でもtouchイベントを受け取った端末では
        // Touch Events側を優先し、Pointer Events側の処理(onPointerDown
        // 等)は無視する(重複処理による座標競合を避けるため)。
        var usingTouchEvents = false;

        // タッチ操作時は指の real 位置に自機を重ねると指で隠れて見えなくなる
        // ため、指の少し上に自機が来るよう画面縦方向にオフセットを掛ける。
        var TOUCH_Y_OFFSET_PX = 80;

        // マルチタッチ誤爆防止: 複数指が同時に触れても最初の1本(pointerId)
        // のみを自機操作の対象とし、2本目以降のタッチは無視する。
        function onPointerDown(e) {
          if (usingTouchEvents) return;
          if (activePointerId !== null && e.pointerId !== activePointerId) {
            return;
          }
          activePointerId = e.pointerId;
          pointerActive = true;
          var offsetY = e.pointerType === "touch" ? TOUCH_Y_OFFSET_PX : 0;
          setPointerTargetFromClientXY(e.clientX, e.clientY, offsetY);
          if (state === STATE_PLAYING) {
            fireBullet();
          }
          if (!audioCtx) {
            ensureAudio();
          }
        }

        function onPointerMove(e) {
          if (usingTouchEvents) return;
          if (pointerActive && e.pointerId === activePointerId) {
            var offsetY = e.pointerType === "touch" ? TOUCH_Y_OFFSET_PX : 0;
            setPointerTargetFromClientXY(e.clientX, e.clientY, offsetY);
          }
        }

        function onPointerUp(e) {
          if (usingTouchEvents) return;
          if (e.pointerId !== activePointerId) {
            return;
          }
          pointerActive = false;
          activePointerId = null;
        }

        // マルチタッチ誤爆防止: 複数指のうち最初の1本(identifier)のみを
        // 自機操作の対象とする(Pointer Events側のactivePointerIdと同じ
        // 考え方)。
        var activeTouchId = null;

        function onTouchStart(e) {
          e.preventDefault();
          usingTouchEvents = true;
          if (activeTouchId !== null) return;
          var touch = e.changedTouches[0];
          activeTouchId = touch.identifier;
          pointerActive = true;
          setPointerTargetFromClientXY(
            touch.clientX,
            touch.clientY,
            TOUCH_Y_OFFSET_PX,
          );
          if (state === STATE_PLAYING) {
            fireBullet();
          }
          if (!audioCtx) {
            ensureAudio();
          }
        }

        function findTouchById(touchList, id) {
          for (var i = 0; i < touchList.length; i++) {
            if (touchList[i].identifier === id) return touchList[i];
          }
          return null;
        }

        function onTouchMove(e) {
          e.preventDefault();
          if (!pointerActive || activeTouchId === null) return;
          var touch = findTouchById(e.changedTouches, activeTouchId);
          if (!touch) return;
          setPointerTargetFromClientXY(
            touch.clientX,
            touch.clientY,
            TOUCH_Y_OFFSET_PX,
          );
        }

        function onTouchEnd(e) {
          e.preventDefault();
          if (!findTouchById(e.changedTouches, activeTouchId)) return;
          pointerActive = false;
          activeTouchId = null;
        }

        function setPointerTargetFromClientXY(clientX, clientY, offsetY) {
          var nx = (clientX / window.innerWidth) * 2 - 1;
          var ny = ((clientY - offsetY) / window.innerHeight) * 2 - 1;
          pointerTarget.x = nx * PLAYER_BOUNDS.maxX;
          pointerTarget.y = -ny * PLAYER_BOUNDS.maxY;
        }

        function loadStage(stageId) {
          // 無敵モードは「ステージクリアまで」の効果なので、次ステージの
          // 読み込みで解除する。
          invincibleModeActive = false;
          currentStage = getStageConfig(stageId);
          buildSky(currentStage);
          buildGround(currentStage);
          spawnSchedule = generateSpawnSchedule(
            currentStage.durationSeconds,
            currentStage.spawnIntervalSeconds,
            currentStage.bossAtSeconds,
            currentStage.domEnabled,
            currentStage.tomosEnabled,
          );
          obstacleSchedule = generateObstacleSchedule(
            currentStage.durationSeconds,
            currentStage.obstacleIntervalSeconds,
            currentStage.id * 1000 + 7,
          );
          nextSpawnIndex = 0;
          pendingBossSpawns = [];
          stageTransitionTimer = 0;
          stageTransitionNextId = null;
          nextObstacleIndex = 0;
          elapsedTime = 0;
          bossRushIndex = 0;
          bossRushAllDefeated = false;

          if (currentStage.bossSequence) {
            // ボスラッシュステージ: 最初のボスだけ少し早めに予約する。
            // 以降のボスは前のボスを倒したタイミングで動的に追加される
            // (spawnNextBossRushEnemyを参照)。
            spawnSchedule.push({
              time: 3,
              kind: "boss",
              laneX: 0,
              bossType: currentStage.bossSequence[0],
            });
            spawnSchedule.sort(function (a, b) {
              return a.time - b.time;
            });
          }

          document.getElementById("stage-display").textContent =
            "STAGE " + currentStage.id + ": " + currentStage.name;
          showStageBanner(
            "STAGE " + currentStage.id + " - " + currentStage.name,
          );
        }

        // ボスラッシュ中のボス撃破をトリガーに次のボスを出現させる。
        // 全ボスを倒し終えたらtrueを返す(呼び出し元でクリア扱いにする)。
        function advanceBossRush() {
          if (!currentStage.bossSequence) return false;
          bossRushIndex += 1;
          if (bossRushIndex >= currentStage.bossSequence.length) {
            return true;
          }
          spawnSchedule.push({
            time: elapsedTime + 1.5,
            kind: "boss",
            laneX: 0,
            bossType: currentStage.bossSequence[bossRushIndex],
          });
          return false;
        }

        function showStageBanner(text) {
          var banner = document.getElementById("stage-banner");
          banner.textContent = text;
          banner.classList.add("visible");
          setTimeout(function () {
            banner.classList.remove("visible");
          }, 2200);
        }

        // ボス出現の直前に警告音+「WARNING」+ボス名を大きく表示する。
        function showBossWarning(bossName) {
          playBossWarningSound();
          var warning = document.getElementById("boss-warning");
          document.getElementById("boss-warning-name").textContent = bossName;
          warning.classList.add("visible");
          cameraShake = Math.max(cameraShake, 0.2);
          setTimeout(function () {
            warning.classList.remove("visible");
          }, BOSS_WARNING_DURATION_MS);
        }

        function startGame() {
          startGameAtStage(1);
        }

        // 新しいプレイを開始する経路(通常ステージ開始/BOSS TEST開始)で
        // 共通して必要になるプレイヤー状態・オーバーレイ・シーンのリセット
        // をまとめる。片方の経路だけ更新されてもう片方が古いままになる
        // 不整合を防ぐため、リセット項目はここに一本化する。
        function resetPlayerRunState() {
          score = 0;
          lives = 3;
          invulnerableTimer = 0;
          invincibleModeActive = false;
          resetCombo();
          gameOverInputLockTimer = 0;
          gameOverAutoReturnTimer = 0;
          cameraShake = 0;
          stats.enemiesDefeated = 0;
          stats.bossesDefeated = 0;
          stats.hitsTaken = 0;
          stats.maxCombo = 0;
          document.getElementById("pause-overlay").classList.add("hidden");
          document
            .getElementById("stage-select-overlay")
            .classList.add("hidden");
          playerPos = { x: 0, y: 0 };
          playerGroup.position.x = 0;
          playerGroup.position.y = 0;
          // エンディング演出(自機が奥・上方へ飛び去る)でZ/回転が変化する
          // ため、新しいプレイ開始時に元の定位置へ戻す。
          playerGroup.position.z = 2;
          playerGroup.rotation.x = 0;
          camera.fov = BASE_FOV;
          camera.updateProjectionMatrix();

          clearGroup(enemies);
          clearGroup(bullets);
          clearGroup(enemyBullets);
          clearGroup(explosions);
          clearGroup(obstacles);
          hideBossHpBar();
        }

        // 隠しコマンドのステージ選択から任意ステージで開始する場合と、
        // 通常のSTARTボタンからステージ1で開始する場合の共通処理。
        function startGameAtStage(stageId) {
          resetPlayerRunState();
          bossTestModeActive = false;

          loadStage(stageId);
          updateHud();
          document.getElementById("message-overlay").classList.add("hidden");
          state = STATE_PLAYING;
          // ゲームオーバーBGM等、前の状態の音が一切残らないようにしてから
          // ステージBGMを開始する。
          stopBgmAndSilence();
          startBgm("stage" + stageId);
          playGetReadyVoice();
        }

        // BOSS TESTタブから、指定ボスのみと戦えるテストモードを開始する。
        // 借用元ステージ(borrowStageId)の背景・地形色・BGMをそのまま使い、
        // 雑魚敵と障害物の出現だけを止め、目的のボスを即座に1体出現させる。
        // 撃破すると同じボスが再度出現し、連続で練習・検証できる。
        function startBossTestMode(bossType, borrowStageId) {
          resetPlayerRunState();
          bossTestModeActive = true;

          currentStage = getStageConfig(borrowStageId);
          buildSky(currentStage);
          buildGround(currentStage);
          spawnSchedule = [];
          obstacleSchedule = [];
          nextSpawnIndex = 0;
          pendingBossSpawns = [];
          stageTransitionTimer = 0;
          stageTransitionNextId = null;
          nextObstacleIndex = 0;
          elapsedTime = 0;
          bossRushIndex = 0;
          bossRushAllDefeated = false;
          bossTestBossType = bossType;

          document.getElementById("stage-display").textContent =
            "BOSS TEST: " + BOSS_NAME_BY_TYPE[bossType];
          showStageBanner("BOSS TEST - " + BOSS_NAME_BY_TYPE[bossType]);

          spawnEnemy("boss", 0, bossType);

          updateHud();
          document.getElementById("message-overlay").classList.add("hidden");
          state = STATE_PLAYING;
          stopBgmAndSilence();
          startBgm("boss");
          playGetReadyVoice();
        }

        function clearGroup(list) {
          for (var i = 0; i < list.length; i++) {
            scene.remove(list[i].mesh);
          }
          list.length = 0;
        }

        // ゲームオーバー/全クリア共通のリザルト内訳(撃破数・被弾数・
        // 最大コンボ)をHTML断片として組み立てる。
        function buildStatsSummaryHtml() {
          return (
            '<p class="stats-summary">' +
            "ENEMIES DEFEATED: " +
            stats.enemiesDefeated +
            " / BOSSES: " +
            stats.bossesDefeated +
            "<br>HITS TAKEN: " +
            stats.hitsTaken +
            " / MAX COMBO: " +
            stats.maxCombo +
            "</p>"
          );
        }

        function endGame() {
          state = STATE_GAMEOVER;
          // ボス戦BGM等が鳴った状態のまま次のBGMへ移ると音が被って聞こえる
          // ため、進行中のBGMループと発音中の音を確実に無音化してから、
          // ゲームオーバー専用BGMを最初から再生する。
          stopBgmAndSilence();
          startBgm("gameover");
          hideBossHpBar();
          gameOverInputLockTimer = GAMEOVER_INPUT_LOCK_SECONDS;
          gameOverAutoReturnTimer = GAMEOVER_AUTO_RETURN_SECONDS;
          var previousHigh = loadHighScore();
          var newHigh = saveHighScoreIfBeaten(score);
          var isNewRecord = newHigh > previousHigh;
          var overlay = document.getElementById("message-overlay");
          overlay.innerHTML =
            "<h1>GAME OVER</h1>" +
            (isNewRecord
              ? '<p style="color:#66ddff">NEW HIGH SCORE!</p>'
              : "") +
            "<p>SCORE: " +
            score +
            "</p><p>HIGH SCORE: " +
            newHigh +
            "</p><p>STAGE " +
            currentStage.id +
            ": " +
            currentStage.name +
            "</p>" +
            buildStatsSummaryHtml() +
            '<button id="start-button" type="button">RETRY</button>';
          overlay.classList.remove("hidden");
          document.getElementById("start-button").onclick = retryFromGameOver;
        }

        function retryFromGameOver() {
          if (gameOverInputLockTimer > 0) return;
          startGame();
        }

        function clearAllEnemiesAndAdvance() {
          var next = nextStageId(currentStage.id);
          if (next === null) {
            startEndingSequence();
            return;
          }
          // 次のステージがある場合は、ゲームを止めずに(stateはPLAYINGの
          // まま)そのまま次ステージへ遷移する。stageTransitionTimerが
          // 正の間は「クリア済み判定の再トリガー」だけを抑止しつつ、
          // 自機操作・敵/弾の描画更新は継続させ、ファンファーレが鳴って
          // いる間も画面が止まらないようにする。
          stopBgm();
          playStageClearSound();
          showStageBanner("STAGE " + currentStage.id + " CLEAR!");
          stageTransitionTimer = STAGE_TRANSITION_SECONDS;
          stageTransitionNextId = next;
        }

        function advanceToNextStage() {
          var next = stageTransitionNextId;
          stageTransitionNextId = null;
          clearGroup(enemies);
          clearGroup(enemyBullets);
          clearGroup(obstacles);
          loadStage(next);
          startBgm("stage" + next);
        }

        // 最終ボス撃破後のエンディング演出を開始する。残っていた敵・弾・
        // 障害物を消し、晴れ渡ったクリーンな配色の空と地面に切り替えたうえ
        // で、しばらく巡航スクロールさせた後に自機を奥・上方へ飛ばす。
        function startEndingSequence() {
          state = STATE_ENDING;
          stopBgm();
          playStageClearSound();
          clearGroup(enemies);
          clearGroup(bullets);
          clearGroup(enemyBullets);
          clearGroup(obstacles);
          hideBossHpBar();
          buildSky({
            skyColorTop: ENDING_SKY_COLOR_TOP,
            skyColorBottom: ENDING_SKY_COLOR_BOTTOM,
          });
          buildGround({ groundColor: ENDING_GROUND_COLOR });
          scene.fog = new THREE.Fog(0xaee0ff, 80, 260);
          endingPhase = "cruise";
          endingTimer = ENDING_CRUISE_SECONDS;
        }

        function updateEnding(dt) {
          groundOffset += GROUND_SPEED * dt;
          if (groundMesh && groundMesh.material.map) {
            groundMesh.material.map.offset.y = groundOffset * 0.03;
          }

          if (endingPhase === "cruise") {
            // 飛び去るまでの間は通常プレイと同じ操作性(キーボード/マウス/
            // タッチ)で自機を動かせるようにする。
            updatePlayerMovement(dt);
            endingTimer -= dt;
            if (endingTimer <= 0) {
              endingPhase = "flyaway";
              endingTimer = ENDING_FLY_AWAY_SECONDS;
              playFlyAwaySound();
            }
          } else if (endingPhase === "flyaway") {
            endingTimer -= dt;
            var progress =
              1 - Math.max(0, endingTimer) / ENDING_FLY_AWAY_SECONDS;
            // イーズイン(加速しながら奥・上方へ)で飛び去る挙動にする。
            var eased = progress * progress;
            playerGroup.position.z = 2 - eased * 140;
            playerGroup.position.y = eased * 60;
            playerGroup.rotation.x = -eased * 0.9;
            playerVel.x *= 0.9;
            playerVel.y *= 0.9;
            camera.fov = BASE_FOV + eased * 25;
            camera.updateProjectionMatrix();
            if (endingTimer <= 0) {
              camera.fov = BASE_FOV;
              camera.updateProjectionMatrix();
              showAllStagesClearResult();
            }
          }
        }

        function showAllStagesClearResult() {
          state = STATE_STAGE_CLEAR;
          endingPhase = null;
          var previousHigh = loadHighScore();
          var newHigh = saveHighScoreIfBeaten(score);
          var isNewRecord = newHigh > previousHigh;
          var overlay = document.getElementById("message-overlay");
          overlay.innerHTML =
            "<h1>ALL STAGES CLEAR!</h1>" +
            (isNewRecord
              ? '<p style="color:#66ddff">NEW HIGH SCORE!</p>'
              : "") +
            "<p>SCORE: " +
            score +
            "</p><p>HIGH SCORE: " +
            newHigh +
            "</p>" +
            buildStatsSummaryHtml() +
            '<button id="start-button" type="button">PLAY AGAIN</button>';
          overlay.classList.remove("hidden");
          document.getElementById("start-button").onclick = startGame;
        }

        function fireBullet() {
          playShotSound();
          var geo = new THREE.SphereGeometry(0.15, 8, 8);
          var mat = new THREE.MeshBasicMaterial({ color: 0xffff66 });
          var mesh = new THREE.Mesh(geo, mat);
          mesh.position.copy(playerGroup.position);
          mesh.position.z -= 1;
          scene.add(mesh);
          bullets.push({ mesh: mesh, speed: 60 });
        }

        var SCALER_SEGMENT_COUNT = 15;
        var SCALER_SEGMENT_SPACING = 1.1;
        // 龍(スケイラ)が画面手前側で折り返すZ座標。自機のすぐ手前ではなく
        // 画面外に近い位置(敵の削除しきい値z>12の直前)まで迫ってから
        // 折り返すことで、中途半端な位置での「描画ジャンプ」を防ぐ。
        var SCALER_NEAR_TURN_Z = 10;
        // 折り返し地点付近(自機のすぐ手前で反対側から現れて見える瞬間)は
        // 不意打ち的な衝突を避けるため、この余裕距離ぶん手前から当たり
        // 判定を無効化する。
        var SCALER_TURN_SAFE_MARGIN = 6;
        // 龍(スケイラ)が折り返す最奥のZ座標。自機の交戦距離よりもさらに
        // 奥まで伸ばし、大胆な遊泳の演出にする。
        var SCALER_DEEP_RETREAT_Z = -160;
        // このZより奥にいる間は火炎(弾)の発射を休止する。
        var SCALER_FIRE_SUSPEND_Z = -60;
        // 龍の基準の高さ。うねりで下に振れても地面(Y=-4)に潜らないよう、
        // 十分に高い位置をデフォルトの登場位置とする。
        var SCALER_HOME_Y = 3;
        // 地面(Y=-4)より高いこのY座標を、うねりの下限クランプ値とする。
        var SCALER_GROUND_CLEARANCE_Y = -1;
        // 火炎放射(ブレス)の連続弾数と、弾同士/ブレス間の間隔(秒)。
        var SCALER_BREATH_SHOT_COUNT = 4;
        var SCALER_BREATH_SHOT_INTERVAL = 0.12;
        var SCALER_BREATH_PAUSE_INTERVAL = 1.8;
        // 火炎(ブレス)弾の見た目の大きさ。通常弾(半径0.25)より大きくする。
        var SCALER_BREATH_BULLET_RADIUS = 0.55;

        function clamp(value, min, max) {
          return Math.max(min, Math.min(max, value));
        }

        function buildScalerMesh() {
          // スケイラ: 東洋の龍をイメージした細長い胴体のドラゴン。
          // 脚は持たず、球体を連ねた蛇状の胴体+頭部の角・ひげ・たてがみで
          // 「空を泳ぐ龍」らしさを表現する。各体節をGroupの子として連ね、
          // 後述のupdateで大きく波打つように動かす。
          var group = new THREE.Group();
          var segments = [];
          var maneMat = new THREE.MeshStandardMaterial({
            color: 0xffcc33,
            emissive: 0x885500,
            emissiveIntensity: 0.4,
          });
          var hornMat = new THREE.MeshStandardMaterial({
            color: 0xf5f0dd,
            emissive: 0x554422,
            emissiveIntensity: 0.2,
          });

          for (var i = 0; i < SCALER_SEGMENT_COUNT; i++) {
            var isHead = i === 0;
            // 頭を最大とし、尾に向かって滑らかに先細りさせることで
            // 龍らしい流線形の胴体にする。
            var taper = 1 - (i / (SCALER_SEGMENT_COUNT - 1)) * 0.6;
            var segSize = isHead ? 1.15 : 0.85 * taper;
            var segMat = new THREE.MeshStandardMaterial({
              color: isHead ? 0x2255cc : 0x2299aa,
              emissive: isHead ? 0x113377 : 0x0a4a55,
              emissiveIntensity: 0.4,
              metalness: 0.3,
              roughness: 0.4,
            });
            var segGeo = isHead
              ? new THREE.ConeGeometry(segSize, segSize * 1.6, 8)
              : new THREE.SphereGeometry(segSize, 10, 8);
            var segMesh = new THREE.Mesh(segGeo, segMat);
            if (isHead) {
              // 円錐の尖端(デフォルトは+Y方向)をX軸周りに90度回転させると
              // +Z方向を向く。体節はグループの-Z方向に連なるため、これで
              // 頭の尖端が進行方向(グループのワールドZ+方向=自機側)を
              // 向くようになる。
              segMesh.rotation.x = Math.PI / 2;

              // 一対の角
              var hornGeo = new THREE.ConeGeometry(0.12, 0.7, 5);
              var hornLeft = new THREE.Mesh(hornGeo, hornMat);
              hornLeft.position.set(-0.35, 0.5, 0.3);
              hornLeft.rotation.x = -Math.PI / 2.6;
              hornLeft.rotation.z = 0.3;
              segMesh.add(hornLeft);
              var hornRight = new THREE.Mesh(hornGeo, hornMat);
              hornRight.position.set(0.35, 0.5, 0.3);
              hornRight.rotation.x = -Math.PI / 2.6;
              hornRight.rotation.z = -0.3;
              segMesh.add(hornRight);

              // 長いひげ(頬から後方へ伸びる細い円柱)
              var whiskerGeo = new THREE.CylinderGeometry(0.04, 0.01, 1.4, 4);
              var whiskerLeft = new THREE.Mesh(whiskerGeo, maneMat);
              whiskerLeft.position.set(-0.5, -0.1, -0.6);
              whiskerLeft.rotation.z = Math.PI / 2.2;
              whiskerLeft.rotation.y = 0.4;
              segMesh.add(whiskerLeft);
              var whiskerRight = new THREE.Mesh(whiskerGeo, maneMat);
              whiskerRight.position.set(0.5, -0.1, -0.6);
              whiskerRight.rotation.z = -Math.PI / 2.2;
              whiskerRight.rotation.y = -0.4;
              segMesh.add(whiskerRight);
            }
            // 頭(i=0)をグループ原点(ローカルZ=0)に置き、体節はグループの
            // ローカル-Z方向(接近時の進行方向と逆側)へ連ねる。これにより
            // グループがワールドZ+方向(自機側)へ進む際、常に頭が先頭になる
            // (体節側が後方に「尻尾」として付いてくる)。
            segMesh.position.z = -i * SCALER_SEGMENT_SPACING;
            group.add(segMesh);

            segments.push(segMesh);
          }

          group.userData.segments = segments;
          group.userData.head = segments[0];
          group.scale.setScalar(SCALER_VISUAL_SCALE);
          return group;
        }

        function buildDomEnemyMesh() {
          // ドム: 重機動ロボット型の敵。円柱の胴体+球体の頭部+腕状のバズーカ。
          var group = new THREE.Group();
          var bodyMat = new THREE.MeshStandardMaterial({
            color: 0x556655,
            emissive: 0x223322,
            emissiveIntensity: 0.3,
          });
          var body = new THREE.Mesh(
            new THREE.CylinderGeometry(0.7, 0.9, 1.6, 8),
            bodyMat,
          );
          group.add(body);

          var headMat = new THREE.MeshStandardMaterial({
            color: 0x334433,
            emissive: 0x112211,
            emissiveIntensity: 0.4,
          });
          var head = new THREE.Mesh(
            new THREE.SphereGeometry(0.5, 10, 8),
            headMat,
          );
          head.position.y = 1.2;
          group.add(head);

          var visorMat = new THREE.MeshStandardMaterial({
            color: 0xff2222,
            emissive: 0xff2222,
            emissiveIntensity: 0.8,
          });
          var visor = new THREE.Mesh(
            new THREE.BoxGeometry(0.6, 0.15, 0.2),
            visorMat,
          );
          visor.position.set(0, 1.2, 0.45);
          group.add(visor);

          var bazookaMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
          var bazooka = new THREE.Mesh(
            new THREE.CylinderGeometry(0.15, 0.15, 1.4, 8),
            bazookaMat,
          );
          bazooka.rotation.z = Math.PI / 2;
          bazooka.position.set(0.9, 0.3, 0.3);
          group.add(bazooka);

          group.userData.muzzle = bazooka;
          return group;
        }

        // サルペドン専用: ボス級のドム(通常ドムより一回り大きく、赤を
        // 基調にした威圧的な配色)。3体編隊でジェットストリームアタック
        // (縦列で連結して突撃し、順番に自機を襲う)を行う。
        function buildBossDomMesh() {
          var group = new THREE.Group();
          var bodyMat = new THREE.MeshStandardMaterial({
            color: 0x663333,
            emissive: 0x441111,
            emissiveIntensity: 0.35,
          });
          var body = new THREE.Mesh(
            new THREE.CylinderGeometry(1, 1.3, 2.4, 8),
            bodyMat,
          );
          group.add(body);

          var headMat = new THREE.MeshStandardMaterial({
            color: 0x442222,
            emissive: 0x220808,
            emissiveIntensity: 0.4,
          });
          var head = new THREE.Mesh(
            new THREE.SphereGeometry(0.75, 10, 8),
            headMat,
          );
          head.position.y = 1.8;
          group.add(head);

          var visorMat = new THREE.MeshStandardMaterial({
            color: 0xff3333,
            emissive: 0xff3333,
            emissiveIntensity: 0.9,
          });
          var visor = new THREE.Mesh(
            new THREE.BoxGeometry(0.9, 0.2, 0.3),
            visorMat,
          );
          visor.position.set(0, 1.8, 0.65);
          group.add(visor);

          var bazookaMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
          var leftBazooka = new THREE.Mesh(
            new THREE.CylinderGeometry(0.22, 0.22, 2, 8),
            bazookaMat,
          );
          leftBazooka.rotation.z = Math.PI / 2;
          leftBazooka.position.set(-1.5, 0.4, 0.4);
          group.add(leftBazooka);
          var rightBazooka = new THREE.Mesh(
            new THREE.CylinderGeometry(0.22, 0.22, 2, 8),
            bazookaMat.clone(),
          );
          rightBazooka.rotation.z = Math.PI / 2;
          rightBazooka.position.set(1.5, 0.4, 0.4);
          group.add(rightBazooka);

          var thrusterMat = new THREE.MeshBasicMaterial({
            color: 0xff6600,

          });

            thrusterMat,
          );
          thruster.rotation.x = -Math.PI / 2;
          thruster.position.set(0, -1, -1);
          group.add(thruster);

          group.userData.leftMuzzle = leftBazooka;
          group.userData.rightMuzzle = rightBazooka;
          group.userData.thruster = thruster;

        }

        // サルペドン: ボス級ドム3体による縦列編隊(ジェットストリーム
        // アタック)。3体は前後に連結して現れ、交戦時は個別にうねりながら
        // 順番に自機を狙う。3体それぞれが独立した被弾判定を持つ。
        function buildSarpedonMesh() {
          var group = new THREE.Group();
          var doms = [];
          var domOffsetsZ = [0, 3.2, 6.4];
          for (var i = 0; i < domOffsetsZ.length; i++) {
            var dom = buildBossDomMesh();
            dom.position.z = domOffsetsZ[i];
            group.add(dom);
            doms.push(dom);
          }
          group.userData.doms = doms;
          return group;
        }

        function buildGenericBossMesh() {
          var geo = new THREE.IcosahedronGeometry(3, 0);
          var mat = new THREE.MeshStandardMaterial({
            color: 0xff0000,
            emissive: 0xff0000,
            emissiveIntensity: 0.3,
          });
          return new THREE.Mesh(geo, mat);
        }

        // ゴダーニ/サルペドン共通: 双頭ドラゴン。常に正面(自機側)を向いたまま
        // 接近するため、往路も復路も両頭が狙いやすい(スケイラとの対比)。
        // transparentを指定するとサルペドンの「スケスケ」版として使える。
        // ゴダーニ/サルペドンの片側の首+頭部一式を作る(角・顎・牙付きで
        // ドラゴンらしいシルエットにする)。sideSignは-1(左)/1(右)。
        function buildDragonHeadUnit(sideSign, transparentBody) {
          var unit = new THREE.Group();
          var scaleMat = new THREE.MeshStandardMaterial({
            color: 0x557733,
            emissive: 0x223311,
            emissiveIntensity: 0.3,
            transparent: !!transparentBody,
            opacity: transparentBody ? 0.35 : 1,
          });
          var headMat = new THREE.MeshStandardMaterial({
            color: 0xdd8833,
            emissive: 0x442200,
            emissiveIntensity: 0.4,
            transparent: !!transparentBody,
            opacity: transparentBody ? 0.5 : 1,
          });
          var hornMat = new THREE.MeshStandardMaterial({
            color: 0x333333,
            emissive: 0x111111,
            emissiveIntensity: 0.2,
            transparent: !!transparentBody,
            opacity: transparentBody ? 0.5 : 1,
          });
          var eyeMat = new THREE.MeshStandardMaterial({
            color: 0xff2222,
            emissive: 0xff2222,
            emissiveIntensity: 0.8,
          });

          // 首(胴体から斜め外側へ伸びるS字寄りのシルエットを、傾けた円錐で表現)。
          // 長さを1.5倍にし、常時ゆらゆらと揺れる演出を加えるため、根本の
          // 位置を回転の基準点(pivot)としたグループでラップする。
          var neckPivot = new THREE.Group();
          neckPivot.position.set(sideSign * 1.3, 0.9, 0.6);
          neckPivot.rotation.z = sideSign * -0.5;
          neckPivot.rotation.x = -0.3;
          unit.add(neckPivot);

          var neck = new THREE.Mesh(
            new THREE.CylinderGeometry(0.35, 0.6, 3.6, 8),
            scaleMat,
          );
          neck.position.y = 0.6;
          neckPivot.add(neck);

          // 頭部本体(細長い顎を持つドラゴンヘッド)。首の先端に追従させる
          // ため、neckPivotの子として配置する(neckPivotが1.2=3.6/2倍
          // 伸びた分だけ先端側にオフセット)。
          var headGroup = new THREE.Group();
          headGroup.position.set(0, 2.1, 1.1);
          // neckPivotの回転(sideSign*-0.5 z, -0.3 x)を打ち消したうえで
          // 元のheadGroupの向き(sideSign*-0.3 z)を再現し、首の揺れに
          // 追従しつつ見た目の向きは変更前とほぼ同じになるようにする。
          headGroup.rotation.z = sideSign * 0.2;
          headGroup.rotation.x = 0.3;
          neckPivot.add(headGroup);

          var skull = new THREE.Mesh(
            new THREE.ConeGeometry(0.55, 1.4, 6),
            headMat,
          );
          skull.rotation.x = Math.PI / 2;
          headGroup.add(skull);

          var jaw = new THREE.Mesh(
            new THREE.ConeGeometry(0.35, 1, 6),
            headMat.clone(),
          );
          jaw.rotation.x = Math.PI / 2;
          jaw.position.set(0, -0.25, 0.3);
          headGroup.add(jaw);

          // 角(左右2本)でドラゴンらしさを強調。
          var hornGeo = new THREE.ConeGeometry(0.12, 0.7, 4);
          var hornLeft = new THREE.Mesh(hornGeo, hornMat);
          hornLeft.position.set(-0.25, 0.5, -0.4);
          hornLeft.rotation.x = -0.6;
          headGroup.add(hornLeft);
          var hornRight = new THREE.Mesh(hornGeo, hornMat.clone());
          hornRight.position.set(0.25, 0.5, -0.4);
          hornRight.rotation.x = -0.6;
          headGroup.add(hornRight);

          // 目(発光する赤い球)。
          var eyeGeo = new THREE.SphereGeometry(0.13, 8, 8);
          var eyeLeft = new THREE.Mesh(eyeGeo, eyeMat);
          eyeLeft.position.set(-0.22, 0.1, -0.55);
          headGroup.add(eyeLeft);
          var eyeRight = new THREE.Mesh(eyeGeo, eyeMat.clone());
          eyeRight.position.set(0.22, 0.1, -0.55);
          headGroup.add(eyeRight);

          unit.userData.headGroup = headGroup;
          unit.userData.neckPivot = neckPivot;
          unit.userData.neckBaseRotationZ = neckPivot.rotation.z;
          unit.userData.neckBaseRotationX = neckPivot.rotation.x;
          unit.userData.sideSign = sideSign;
          return unit;
        }

        function buildTwinHeadDragonMesh(transparentBody) {
          var group = new THREE.Group();
          var bodyMat = new THREE.MeshStandardMaterial({
            color: 0x557733,
            emissive: 0x223311,
            emissiveIntensity: 0.3,
            transparent: !!transparentBody,
            opacity: transparentBody ? 0.35 : 1,
          });
          var body = new THREE.Mesh(
            new THREE.IcosahedronGeometry(2, 1),
            bodyMat,
          );
          // ボディを0.8倍に縮小し、双頭と首・翼の存在感が際立つ
          // プロポーションにする。
          body.scale.set(1 * 0.8, 0.85 * 0.8, 1.2 * 0.8);
          group.add(body);

          // 足(胴体の下に4本の脚を生やし、双頭ドラゴンらしいシルエットを
          // 強調する)。
          var legMat = new THREE.MeshStandardMaterial({
            color: 0x445522,
            emissive: 0x1a2a0e,
            emissiveIntensity: 0.3,
            transparent: !!transparentBody,
            opacity: transparentBody ? 0.35 : 1,
          });
          var legGeo = new THREE.CylinderGeometry(0.28, 0.22, 1.3, 6);
          var legOffsets = [
            [-1.1, -1.1, 0.7],
            [1.1, -1.1, 0.7],
            [-1.1, -1.1, -0.7],
            [1.1, -1.1, -0.7],
          ];
          for (var legI = 0; legI < legOffsets.length; legI++) {
            var legOffset = legOffsets[legI];
            var leg = new THREE.Mesh(legGeo, legMat.clone());
            leg.position.set(legOffset[0], legOffset[1], legOffset[2]);
            group.add(leg);
          }

          // 翼(左右に大きく張り出す平たい三角形)でシルエットに幅を持たせる。
          // 羽ばたきアニメーションのため、根本を基準点としたpivotで包む。
          var wingMat = new THREE.MeshStandardMaterial({
            color: 0x336622,
            emissive: 0x112211,
            emissiveIntensity: 0.2,
            transparent: !!transparentBody,
            opacity: transparentBody ? 0.3 : 0.9,
            side: THREE.DoubleSide,
          });
          var wingGeo = new THREE.ConeGeometry(1.8, 0.15, 3);
          var wingPivotLeft = new THREE.Group();
          wingPivotLeft.position.set(-0.4, 0.3, -0.8);
          group.add(wingPivotLeft);
          var wingLeft = new THREE.Mesh(wingGeo, wingMat);
          wingLeft.rotation.z = Math.PI / 2;
          wingLeft.position.set(-1.8, 0, 0);
          wingPivotLeft.add(wingLeft);

          var wingPivotRight = new THREE.Group();
          wingPivotRight.position.set(0.4, 0.3, -0.8);
          group.add(wingPivotRight);
          var wingRight = new THREE.Mesh(wingGeo, wingMat.clone());
          wingRight.rotation.z = -Math.PI / 2;
          wingRight.position.set(1.8, 0, 0);
          wingPivotRight.add(wingRight);

          var leftUnit = buildDragonHeadUnit(-1, transparentBody);
          group.add(leftUnit);
          var rightUnit = buildDragonHeadUnit(1, transparentBody);
          group.add(rightUnit);

          group.userData.leftHead = leftUnit.userData.headGroup;
          group.userData.rightHead = rightUnit.userData.headGroup;
          group.userData.leftUnit = leftUnit;
          group.userData.rightUnit = rightUnit;
          group.userData.leftNeckPivot = leftUnit.userData.neckPivot;
          group.userData.rightNeckPivot = rightUnit.userData.neckPivot;
          group.userData.wingPivotLeft = wingPivotLeft;
          group.userData.wingPivotRight = wingPivotRight;
          group.userData.body = body;
          return group;
        }

        // トモス: 花弁状の殻(複数の平たいパネル)が本体球を囲み、殻を全て
        // 破壊するまで本体はダメージを受けない(原作の「ぱくぱくトモス」を
        // 開閉する花弁として抽象化)。
        // トモス: 巨大な花の姿をしたボス。中心の花芯(黄色く発光する球体)を
        // 涙滴型の花弁6枚が囲んでガードし、花弁を全て破壊するまで花芯は
        // 無敵。外側には萼(がく)状のトゲを配置して花の付け根らしさを出す。
        function buildTomosBossMesh() {
          var group = new THREE.Group();

          // 花芯(本体)。中央が黄色く発光する球体で、花の中心らしさを出す。
          var coreMat = new THREE.MeshStandardMaterial({
            color: 0xffdd44,
            emissive: 0x886600,
            emissiveIntensity: 0.3,
          });
          var core = new THREE.Mesh(
            new THREE.SphereGeometry(1.1, 12, 10),
            coreMat,
          );
          group.add(core);
          var coreDetail = new THREE.Mesh(
            new THREE.IcosahedronGeometry(0.5, 0),
            new THREE.MeshStandardMaterial({
              color: 0x442200,
              emissive: 0x221100,
              emissiveIntensity: 0.3,
            }),
          );
          group.add(coreDetail);

          // 萼(がく): 花芯の下側に配置する小さな緑のトゲで、茎から咲いた
          // 花であることを示す。
          var sepalMat = new THREE.MeshStandardMaterial({ color: 0x336622 });
          var sepalCount = 5;
          for (var si = 0; si < sepalCount; si++) {
            var sepal = new THREE.Mesh(
              new THREE.ConeGeometry(0.25, 0.9, 4),
              sepalMat,
            );
            var sepalAngle = (si / sepalCount) * Math.PI * 2;
            sepal.position.set(
              Math.cos(sepalAngle) * 0.9,
              -1.4,
              Math.sin(sepalAngle) * 0.9,
            );
            sepal.rotation.x = Math.PI;
            group.add(sepal);
          }

          // 花弁: 先端が尖った涙滴型(平面を2枚貼り合わせた紡錘形)にし、
          // 付け根から先端へグラデーションする配色で花らしさを強調する。
          var petals = [];
          var petalCount = 6;
          var petalShape = new THREE.Shape();
          petalShape.moveTo(0, 0);
          petalShape.quadraticCurveTo(0.9, 0.6, 0, 2.6);
          petalShape.quadraticCurveTo(-0.9, 0.6, 0, 0);
          var petalGeo = new THREE.ShapeGeometry(petalShape);
          for (var i = 0; i < petalCount; i++) {
            var petalMat = new THREE.MeshStandardMaterial({
              color: 0xff3377,
              emissive: 0x881133,
              emissiveIntensity: 0.4,
              side: THREE.DoubleSide,
            });
            var petal = new THREE.Mesh(petalGeo, petalMat);
            var angle = (i / petalCount) * Math.PI * 2;
            petal.userData.baseAngle = angle;
            petal.position.set(0, 0, 0);
            group.add(petal);
            petals.push(petal);
          }

          group.userData.core = core;
          group.userData.coreDetail = coreDetail;
          group.userData.petals = petals;
          return group;
        }

        // ぱくぱくトモス(通常敵版): 小型で開閉しながら高速接近する編隊メンバー。
        function buildTomosEnemyMesh() {

        // ウィーバー: 大きく左右にうねりながら接近する小型の蛇(ファンタジー

        // アイダ: 赤目の仏頂面モアイ。複数体が編隊で本体(バーバリアン)を守る。
        function buildAidaMesh() {
