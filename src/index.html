        // バーバリアン: アイダの編隊中央に潜む本体。ルーパー(クラゲ状の
        // ガーディアン)を周囲に纏いながら高耐久・多弾で迎え撃つ。
        // バーバリアン: グラディウスのモアイを意識した石像の巨大な顔。
        // 正面を向いたまま自機に迫り、大きく開いた口からリップルミサイル
        // (波状にうねりながら追尾する弾)を連射する。
        // MOAIがリップルミサイルを発射してから口を開けたままにする秒数。
        var BARBARIAN_MOUTH_OPEN_SECONDS = 0.35;
        // 口(弱点)への命中判定に使う許容距離。
        var BARBARIAN_MOUTH_HIT_RADIUS = 1.1;
        // 口が開いている間に口へ命中した場合の弱点ダメージ(通常は1)。
        var BARBARIAN_MOUTH_WEAKPOINT_DAMAGE = 3;
        // ゴダーニ/トモスの左右ドリフトの速度・振幅。
        var GODANI_DRIFT_SPEED = 0.5;
        var GODANI_DRIFT_AMPLITUDE = 4;
        var TOMOS_DRIFT_SPEED = 0.35;
        var TOMOS_DRIFT_AMPLITUDE = 3.5;
        // MOAIが画面内で跳ねる際の、1ジャンプあたりの速さと高さの範囲。
        // 最大は画面外(PLAYER_BOUNDS.maxYを超える)まで跳ぶこともある。
        var MOAI_BOUNCE_SPEED = 0.9;
        var MOAI_BOUNCE_MIN_HEIGHT = 1;
        var MOAI_BOUNCE_MAX_HEIGHT = 9;

        function buildBarbarianMesh() {
          var group = new THREE.Group();
          var stoneMat = new THREE.MeshStandardMaterial({
            color: 0x998866,
            emissive: 0x332211,
            emissiveIntensity: 0.3,
          });
          // モアイらしい縦長のシルエットにするため、高さを4.5→6.2に伸ばす。
          var face = new THREE.Mesh(
            new THREE.CylinderGeometry(2.2, 2.6, 6.2, 8),
            stoneMat,
          );
          group.add(face);

          // 耳(細長い耳タブ)とイヤリング(発光する輪)。
          var earMat = new THREE.MeshStandardMaterial({
            color: 0x887755,
            emissive: 0x221100,
            emissiveIntensity: 0.2,
          });
          var earringMat = new THREE.MeshStandardMaterial({
            color: 0xffdd44,
            emissive: 0xffaa00,
            emissiveIntensity: 0.6,
          });
          var earGeo = new THREE.CapsuleGeometry(0.35, 1.8, 4, 8);
          var earringGeo = new THREE.TorusGeometry(0.35, 0.08, 8, 12);
          var leftEar = new THREE.Mesh(earGeo, earMat);
          leftEar.position.set(-2.3, -0.2, 0.3);
          group.add(leftEar);
          var leftEarring = new THREE.Mesh(earringGeo, earringMat);
          leftEarring.position.set(-2.3, -1.3, 0.3);
          group.add(leftEarring);
          var rightEar = new THREE.Mesh(earGeo, earMat.clone());
          rightEar.position.set(2.3, -0.2, 0.3);
          group.add(rightEar);
          var rightEarring = new THREE.Mesh(earringGeo, earringMat.clone());
          rightEarring.position.set(2.3, -1.3, 0.3);
          group.add(rightEarring);

          var browMat = new THREE.MeshStandardMaterial({
            color: 0x776655,
            emissive: 0x221100,
            emissiveIntensity: 0.2,
          });
          var brow = new THREE.Mesh(
            new THREE.BoxGeometry(3.4, 0.6, 1),
            browMat,
          );
          brow.position.set(0, 1.4, 1.6);
          group.add(brow);

          var eyeMat = new THREE.MeshStandardMaterial({
            color: 0xffcc00,
            emissive: 0xffaa00,
            emissiveIntensity: 0.8,
          });
          var eyeGeo = new THREE.SphereGeometry(0.5, 10, 10);
          var leftEye = new THREE.Mesh(eyeGeo, eyeMat);
          leftEye.position.set(-1, 0.9, 1.9);
          group.add(leftEye);
          var rightEye = new THREE.Mesh(eyeGeo, eyeMat.clone());
          rightEye.position.set(1, 0.9, 1.9);
          group.add(rightEye);

          var noseMat = new THREE.MeshStandardMaterial({ color: 0x776655 });
          var nose = new THREE.Mesh(
            new THREE.ConeGeometry(0.85, 1.9, 6),
            noseMat,
          );
          nose.rotation.x = Math.PI / 2;
          nose.position.set(0, -0.1, 2.4);
          group.add(nose);

          // 口(リップルミサイルの発射口)。開閉アニメーションのため上下2枚の
          // 唇パーツをGroupの子として持たせ、userData経由で回転制御する。
          var mouthMat = new THREE.MeshStandardMaterial({
            color: 0x552211,
            emissive: 0xff3300,
            emissiveIntensity: 0.4,
          });
          // カプセル形状(円柱+半球の両端)を横向きにすることで、四角い
          // 箱よりも唇らしい丸みのあるシルエットになる。顔の幅(直径
          // 4.4〜5.2)に対して唇が小さすぎると赤い塊にしか見えないため、
          // 横幅・太さを拡大して視認性を確保する。
          var upperLip = new THREE.Mesh(
            new THREE.CapsuleGeometry(0.45, 2.4, 4, 8),
            mouthMat,
          );
          upperLip.rotation.z = Math.PI / 2;
          upperLip.position.set(0, -1.5, 2.1);
          group.add(upperLip);
          // 下唇は顔(円柱)の丸みに沿ってめり込み、中央部分が隠れて
          // 左右2つに分かれて見えることがあるため、上唇よりわずかに
          // 手前(Z+方向)に出して顔面から浮かせ、1つの唇として見えるように
          // する。
          var lowerLip = new THREE.Mesh(
            new THREE.CapsuleGeometry(0.45, 2.4, 4, 8),
            mouthMat.clone(),
          );
          lowerLip.rotation.z = Math.PI / 2;
          lowerLip.position.set(0, -2.15, 2.3);
          group.add(lowerLip);
          var mouthMuzzle = new THREE.Object3D();
          mouthMuzzle.position.set(0, -1.7, 2.4);
          group.add(mouthMuzzle);

          group.userData.leftEye = leftEye;
          group.userData.rightEye = rightEye;
          group.userData.upperLip = upperLip;
          group.userData.lowerLip = lowerLip;
          group.userData.mouth = mouthMuzzle;
          group.userData.body = face;
          return group;
        }

        // 最終ボス ABSYMBEL: 複数形態を象徴する多層構造(コア+回転リング)。
        function buildFinalBossMesh() {
          var group = new THREE.Group();
          var coreMat = new THREE.MeshStandardMaterial({
            color: 0xffcc00,
            emissive: 0xff8800,
            emissiveIntensity: 0.6,
          });
          var core = new THREE.Mesh(
            new THREE.OctahedronGeometry(2, 1),
            coreMat,
          );
          group.add(core);

          var ringMat = new THREE.MeshStandardMaterial({
            color: 0x9933ff,
            emissive: 0x551188,
            emissiveIntensity: 0.5,
            side: THREE.DoubleSide,
          });
          var ring1 = new THREE.Mesh(
            new THREE.TorusGeometry(3, 0.25, 8, 20),
            ringMat,
          );
          group.add(ring1);
          var ring2 = new THREE.Mesh(
            new THREE.TorusGeometry(3, 0.25, 8, 20),
            ringMat.clone(),
          );
          ring2.rotation.x = Math.PI / 2;
          group.add(ring2);

          group.userData.core = core;
          group.userData.ring1 = ring1;
          group.userData.ring2 = ring2;
          return group;
        }

        // ステージ内の経過時間に応じて敵速度・弾速を段階的に上昇させる
        // (DIFFICULTY_RAMP_SECONDSごとに最大DIFFICULTY_RAMP_MAXまで線形増加)。
        function getDifficultyMultiplier() {
          // ボステストモードでは検証条件を一定に保つため、時間経過による
          // 難易度上昇を無効化する。
          if (bossTestModeActive) return 1;
          var ramp = Math.min(elapsedTime / DIFFICULTY_RAMP_SECONDS / 3, 1);
          return 1 + ramp * DIFFICULTY_RAMP_MAX;
        }

        var BOSS_HP_BY_TYPE = {
          scaler: 15,
          godani: 20,
          tomos: 18,
          sarpedon: 22,
          barbarian: 28,
          final: 50,
          generic: 25,
        };
        var BOSS_SPEED_BY_TYPE = {
          scaler: 12,
          godani: 7,
          tomos: 6,
          sarpedon: 7,
          barbarian: 6,
          final: 6,
          generic: 8,
        };
        var BOSS_SIZE_BY_TYPE = {
          scaler: 2.75,
          tomos: 2.2,
        };
        // スケイラ(龍)本体のビジュアルスケール。衝突判定の半径
        // (BOSS_SIZE_BY_TYPE)とは別に、メッシュ自体を大きく見せるための
        // 拡大率(2.5倍)。
        var SCALER_VISUAL_SCALE = 2.5;
        // 各ボスが接近して留まる交戦距離の範囲(手前ほど密着して危険)。
        // 初回接近時にこの範囲からランダムに1点を抽選し、そこで往復の
        // 折り返し地点とする(戦うたびに間合いが変わり単調にならない)。
        var BOSS_ENGAGE_RANGE_BY_TYPE = {
          godani: [-18, -8],
          tomos: [-15, -5],
          sarpedon: [-16, -6],
          barbarian: [-12, -2],
          final: [-10, 0],
          generic: [-20, -10],
        };
        var BOSS_NAME_BY_TYPE = {
          scaler: "SCALER",
          godani: "GODANI",
          tomos: "TOMOS",
          sarpedon: "JET STREAM DOMS",
          barbarian: "MOAI",
          final: "ABSYMBEL",
          generic: "BOSS",
        };

        // 隠しコマンドのBOSS TESTタブで選べるボス一覧。各ボスが登場する
        // 本来のステージ設定(色・敵速度倍率)を借用して雰囲気を再現する。
        var BOSS_TEST_ENTRIES = [
          { bossType: "scaler", stageId: 1 },
          { bossType: "godani", stageId: 2 },
          { bossType: "tomos", stageId: 3 },
          { bossType: "sarpedon", stageId: 4 },
          { bossType: "barbarian", stageId: 5 },
          { bossType: "final", stageId: 7 },
        ];

        // 隠しコマンドのENDINGタブ用。エントリーは1件のみで、選択すると
        // 最終ボス撃破直後のエンディング演出(巡航→飛び去り→結果画面)を
        // 単体で確認できる。
        var ENDING_ENTRIES = [{ label: "ENDING SEQUENCE" }];

        function buildBossMeshByType(bossType) {
          switch (bossType) {
            case "scaler":
              return buildScalerMesh();
            case "godani":
              return buildTwinHeadDragonMesh(false);
            case "sarpedon":
              return buildSarpedonMesh();
            case "tomos":
              return buildTomosBossMesh();
            case "barbarian":
              return buildBarbarianMesh();
            case "final":
              return buildFinalBossMesh();
            default:
              return buildGenericBossMesh();
          }
        }

        function spawnEnemy(kind, laneX, bossTypeOverride) {
          var mesh;
          var bossType =
            kind === "boss" ? bossTypeOverride || currentStage.bossType : null;
          var isTwinHead = bossType === "godani";
          var isSarpedon = bossType === "sarpedon";
          var isTomosBoss = bossType === "tomos";
          var size =
            kind === "boss"
              ? (BOSS_SIZE_BY_TYPE[bossType] ?? 3)
              : kind === "dom"
                ? 0.9
                : kind === "tomos"
                  ? 0.6
                  : kind === "dasher"
                    ? 0.55
                    : kind === "weaver"
                      ? 0.7
                      : 1;

          if (kind === "boss") {
            mesh = buildBossMeshByType(bossType);
          } else if (kind === "dom") {
            mesh = buildDomEnemyMesh();
          } else if (kind === "tomos") {
            mesh = buildTomosEnemyMesh();
          } else if (kind === "dasher") {
            mesh = buildDasherMesh();
          } else if (kind === "weaver") {
            mesh = buildWeaverMesh();
          } else {
            var color = kind === "shooter" ? 0xff8800 : 0x00ff88;
            var geo = new THREE.IcosahedronGeometry(size, 0);
            var mat = new THREE.MeshStandardMaterial({
              color: color,
              emissive: color,
              emissiveIntensity: 0.3,
            });
            mesh = new THREE.Mesh(geo, mat);
          }

          mesh.position.set(laneX, Math.random() * 3, -140);
          scene.add(mesh);

          var bossHp =
            kind === "boss" ? (BOSS_HP_BY_TYPE[bossType] ?? 25) : null;
          var bossSpeed =
            kind === "boss" ? (BOSS_SPEED_BY_TYPE[bossType] ?? 8) : null;

          var enemy = {
            mesh: mesh,
            kind: kind,
            bossType: bossType,
            radius: size,
            speed:
              (kind === "boss"
                ? bossSpeed
                : kind === "dom"
                  ? 14
                  : kind === "tomos"
                    ? 26
                    : kind === "dasher"
                      ? 42
                      : kind === "weaver"
                        ? 20
                        : 22) *
              currentStage.enemySpeedMultiplier *
              getDifficultyMultiplier(),
            hp: kind === "boss" ? bossHp : kind === "dom" ? 2 : 1,
            maxHp: kind === "boss" ? bossHp : kind === "dom" ? 2 : 1,
            fireTimer: Math.random() * 2,
            baseX: laneX,
            baseY: Math.random() * 3,
            wavePhase: Math.random() * Math.PI * 2,
            // ダッシャーは直線的な高速突撃が持ち味のため、うねりをほぼ
            // 無効化する。ウィーバーは逆に大きく蛇行させ、避けにくい
            // 軌道にする。
            waveSpeed:
              kind === "boss" ? 0 : kind === "weaver" ? 3 : 1.5 + Math.random(),
            waveAmplitude:
              kind === "boss"
                ? 0
                : kind === "dasher"
                  ? 0.2
                  : kind === "weaver"
                    ? 5.5
                    : 2 + Math.random() * 1.5,
            // ステージ難易度(enemySpeedMultiplier)が高いほど上下ウェーブの
            // 振幅・周期を大きくし、後半ステージほど回避が難しくなるようにする。
            verticalWavePhase: Math.random() * Math.PI * 2,
            verticalWaveSpeed: kind === "boss" ? 0 : 0.8 + Math.random() * 0.6,
            verticalWaveAmplitude:
              kind === "boss"
                ? 0
                : Math.max(0, currentStage.enemySpeedMultiplier - 1) * 6 + 0.5,
            swoopDir: 1,
          };

          if (bossType === "scaler") {
            // 画面いっぱいを使った大きな8の字遊泳になるよう振幅を拡大
            // (kind==="boss"はwaveAmplitudeが既定で0になるため明示設定)。
            enemy.waveAmplitude = 8;
            // うねりで大きく下に振れても地面に潜らないよう、基準の高さを
            // 高めに設定する(地面Y=-4、下振れ幅は最大でwaveAmplitude*0.55)。
            enemy.homeY = SCALER_HOME_Y;
            mesh.position.y = SCALER_HOME_Y;
          }
          if (isTwinHead) {
            enemy.leftHp = Math.ceil(bossHp / 2);
            enemy.rightHp = Math.ceil(bossHp / 2);
            // 交互ホーミング弾: 左右どちらの頭から撃つかを毎回切り替える
            // ためのトグルフラグ。
            enemy.nextFiringHeadIsLeft = true;
          }
          if (isSarpedon) {
            // 3体のドムそれぞれが独立したHPを持ち、1体ずつ撃破していく。
            var perDomHp = Math.ceil(bossHp / 3);
            enemy.domHp = [perDomHp, perDomHp, perDomHp];
            // ジャンプアタック: 通常は左右にうねるだけだが、時々予兆の後、
            // 縦方向に放物線を描きながら自機の位置へジャンプして着地し、
            // その後また奥へ戻る演出のための状態。
            enemy.dashState = "idle";
            enemy.dashTimer = 2 + Math.random() * 2;
            enemy.jumpOrigin = new THREE.Vector3();
            enemy.jumpTarget = new THREE.Vector3();
            enemy.dashProgress = 0;
            enemy.homeY = mesh.position.y;
          }
          if (isTomosBoss) {
            enemy.petalHp = [3, 3, 3, 3, 3, 3];
            enemy.coreVulnerable = false;
          }
          if (bossType === "barbarian") {
            enemy.escortCount = 4;
            // 画面内で跳ねる動作の基準の高さ。
            enemy.homeY = mesh.position.y;
          }

          enemies.push(enemy);
          if (kind === "boss") {
            showBossHpBar(BOSS_NAME_BY_TYPE[bossType] || "BOSS");
            startBgm("boss");
            bossZoomTimer = BOSS_ZOOM_DURATION;
          }
        }

        function showBossHpBar(bossName) {
          document.getElementById("boss-hp-label").textContent =
            bossName || "BOSS";
          document.getElementById("boss-hp-container").classList.add("visible");
          document.getElementById("boss-hp-bar-inner").style.width = "100%";
        }

        function updateBossHpBar(boss) {
          var ratio = Math.max(0, boss.hp / boss.maxHp);
          document.getElementById("boss-hp-bar-inner").style.width =
            ratio * 100 + "%";
        }

        function hideBossHpBar() {
          document
            .getElementById("boss-hp-container")
            .classList.remove("visible");
        }

        // 遺跡風の崩れた石柱群(原作のファンタジー的な地形装飾を意識)。
        // 高さの異なる3本の柱を寄せ集め、廃墟らしいシルエットにする。
        function buildRuinsMesh() {
          var group = new THREE.Group();
          var mat = new THREE.MeshStandardMaterial({ color: 0x776655 });
          var heights = [6, 8, 4.5];
          var offsets = [-1.2, 0, 1.3];
          for (var i = 0; i < heights.length; i++) {
            var pillar = new THREE.Mesh(
              new THREE.CylinderGeometry(0.5, 0.6, heights[i], 6),
              mat,
            );
            pillar.position.set(offsets[i], heights[i] / 2 - 4, 0);
            pillar.rotation.z = (Math.random() - 0.5) * 0.15;
            group.add(pillar);
          }
          return group;
        }

        // 浮遊島: 岩の塊の上に緑地が乗った、ファンタジー世界観を象徴する
        // 装飾オブジェクト(スペースハリアーらしい非現実的な浮遊感を演出)。
        function buildFloatingIslandMesh() {
          var group = new THREE.Group();
          var rockMat = new THREE.MeshStandardMaterial({ color: 0x554433 });
          var rock = new THREE.Mesh(new THREE.ConeGeometry(2.2, 2, 6), rockMat);
          rock.rotation.x = Math.PI;
          group.add(rock);

          var grassMat = new THREE.MeshStandardMaterial({ color: 0x66bb44 });
          var grass = new THREE.Mesh(
            new THREE.CylinderGeometry(2.3, 2.3, 0.4, 8),
            grassMat,
          );
          grass.position.y = 1;
          group.add(grass);

          return group;
        }

        function spawnObstacle(kind, laneX) {
          var mesh;
          if (kind === "pillar") {
            var geo = new THREE.CylinderGeometry(0.8, 0.8, 10, 8);
            var mat = new THREE.MeshStandardMaterial({ color: 0x888899 });
            mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(laneX, 1, -160);
          } else if (kind === "ruins") {
            mesh = buildRuinsMesh();
            mesh.position.set(laneX, 0, -160);
          } else if (kind === "floating_island") {
            mesh = buildFloatingIslandMesh();
            mesh.position.set(laneX, Math.random() * 2 + 1, -160);
          } else {
            var rockGeo = new THREE.DodecahedronGeometry(1.4, 0);
            var rockMat = new THREE.MeshStandardMaterial({ color: 0x664433 });
            mesh = new THREE.Mesh(rockGeo, rockMat);
            mesh.position.set(laneX, -3.5, -160);
          }
          scene.add(mesh);
          obstacles.push({
            mesh: mesh,
            radius: kind === "pillar" || kind === "ruins" ? 1.2 : 1.4,
            hitHeight:
              kind === "pillar" || kind === "ruins"
                ? 999
                : kind === "floating_island"
                  ? 2.5
                  : 1.6,
            speed: 26,
          });
        }

        function spawnEnemyBulletAt(sourcePosition, dir, homingTarget, radius) {
          var geo = new THREE.SphereGeometry(radius || 0.25, 8, 8);
          var mat = new THREE.MeshBasicMaterial({ color: 0xff3333 });
          var mesh = new THREE.Mesh(geo, mat);
          mesh.position.copy(sourcePosition);
          scene.add(mesh);
          var bullet = {
            mesh: mesh,
            dir: dir,
            speed: 30,
            nearMissPlayed: false,
          };
          if (homingTarget) {
            // 発射時点の自機位置(固定目標)へ、進行方向を徐々に収束させる。
            // 完全追尾(現在の自機位置を常に追う)とは異なり、発射後に自機が
            // 動けば普通に避けられるが、初速の直進弾よりも軌道が曲がる分
            // 見切りにくく緊張感が出る。
            bullet.isHomingToFixedTarget = true;
            bullet.homingTarget = homingTarget.clone();
            // 初速は扇状に広がった方向のまま飛び出し、その後急旋回で
            // ホーミング先へ大きく軌道を曲げる(極端に曲がる弾道にする)。
            bullet.homingTurnRate = 4.5;
          }
          enemyBullets.push(bullet);
        }

        function firePlayerDirected(sourcePosition, radius) {
          var dir = new THREE.Vector3()
            .subVectors(playerGroup.position, sourcePosition)
            .normalize();
          spawnEnemyBulletAt(sourcePosition, dir, null, radius);
        }

        // ホーミング弾(ゴダーニ専用): 発射直後は発射元の頭部の向きに飛ぶが、
        // 飛行中は少しずつ自機方向へ軌道修正する。直進弾よりは避けにくいが
        // 完全追尾ではないため、左右に大きく動けば振り切れる。
        function spawnHomingMissile(sourcePosition) {
          var dir = new THREE.Vector3()
            .subVectors(playerGroup.position, sourcePosition)
            .normalize();
          var geo = new THREE.ConeGeometry(0.22, 0.6, 8);
          var mat = new THREE.MeshBasicMaterial({ color: 0xffaa22 });
          var mesh = new THREE.Mesh(geo, mat);
          mesh.position.copy(sourcePosition);
          mesh.lookAt(playerGroup.position);
          mesh.rotateX(Math.PI / 2);
          scene.add(mesh);
          enemyBullets.push({
            mesh: mesh,
            dir: dir,
            speed: 26,
            nearMissPlayed: false,
            isHoming: true,
            homingTurnRate: 1.8,
          });
        }

        // リップルミサイル(バーバリアン専用): グラディウスのリップルレーザー
        // を意識し、自機へ向かう基本方向を保ちつつ左右にサインカーブで
        // 波打ちながら進む誘導弾。直進弾より避けにくいが、波の分だけ
        // 到達が遅く見切りやすい。
        function spawnRippleMissile(sourcePosition) {
          var dir = new THREE.Vector3()
            .subVectors(playerGroup.position, sourcePosition)
            .normalize();
          // リップル(波紋)らしくドーナツ型(トーラス)にし、進行方向を
          // 軸として見えるよう向きを合わせる。
          var geo = new THREE.TorusGeometry(0.32, 0.13, 8, 16);
          var mat = new THREE.MeshBasicMaterial({ color: 0xff6600 });
          var mesh = new THREE.Mesh(geo, mat);
          mesh.position.copy(sourcePosition);
          mesh.lookAt(sourcePosition.clone().add(dir));
          scene.add(mesh);
          // 進行方向に直交する横ベクトル(Y軸との外積)を波のうねり方向に使う。
          var lateral = new THREE.Vector3()
            .crossVectors(dir, new THREE.Vector3(0, 1, 0))
            .normalize();
          enemyBullets.push({
            mesh: mesh,
            dir: dir,
            speed: 22,
            nearMissPlayed: false,
            isRipple: true,
            lateral: lateral,
            wavePhase: 0,
            basePosition: mesh.position.clone(),
            travelDistance: 0,
          });
        }

        // 見た目は扇状に広がって発射しつつ、実際に命中させるため各弾は
        // 発射時点の自機位置(固定目標)へホーミングで収束させる。
        // 初速の方向だけをXY平面上の角度で扇状に広げ(spawnEnemyBulletAtの
        // dir引数)、ホーミング先(homingTarget)は「自機位置を中心に横方向
        // へオフセットした着弾目標点」にすることで、見た目の扇形はそのまま
        // 保ちつつ、直進のみでは画面外に逸れてしまう問題を回避する。
        function fireFan(sourcePosition, count, spreadRadians) {
          var toPlayer = new THREE.Vector3().subVectors(
            playerGroup.position,
            sourcePosition,
          );
          var baseAngle = Math.atan2(toPlayer.y, toPlayer.x);
          var lateral = new THREE.Vector3()
            .crossVectors(toPlayer, new THREE.Vector3(0, 1, 0))
            .normalize();
          // spreadRadiansをホーミング先の横方向オフセット幅にも変換し、
          // 扇の見た目の広さとホーミング先の広がりを一致させる。
          var maxLateralOffset = spreadRadians * 2.2;

          for (var i = 0; i < count; i++) {
            var t = count === 1 ? 0.5 : i / (count - 1);
            var angle = baseAngle + (t - 0.5) * spreadRadians;
            var initialDir = new THREE.Vector3(
              Math.cos(angle),
              Math.sin(angle),
              toPlayer.z >= 0 ? 0.5 : -0.5,
            ).normalize();

            var offset = (t - 0.5) * 2 * maxLateralOffset;
            var target = playerGroup.position
              .clone()
              .addScaledVector(lateral, offset);

            spawnEnemyBulletAt(sourcePosition, initialDir, target);
          }
        }

        function fireAtPlayer(enemy) {
          if (enemy.kind === "dom") {
            var muzzleWorldPos = new THREE.Vector3();
            enemy.mesh.userData.muzzle.getWorldPosition(muzzleWorldPos);
            firePlayerDirected(muzzleWorldPos);
            return;
          }

          if (enemy.kind === "weaver") {
            // ウィーバーは大蛇行しながら接近する分、弾も直進ではなく
            // ホーミング弾にすることで回避難度を保つ。
            spawnHomingMissile(enemy.mesh.position);
            return;
          }

          if (enemy.kind !== "boss") {
            var dir = new THREE.Vector3()
              .subVectors(playerGroup.position, enemy.mesh.position)
              .normalize();
            spawnEnemyBulletAt(enemy.mesh.position, dir);
            return;
          }

          if (enemy.bossType === "scaler") {
            var headWorldPos = new THREE.Vector3();
            enemy.mesh.userData.head.getWorldPosition(headWorldPos);
            // 火炎放射のイメージなので、通常弾より大きめの弾にする。
            firePlayerDirected(headWorldPos, SCALER_BREATH_BULLET_RADIUS);
          } else if (enemy.bossType === "godani") {
            // 交互ホーミング弾: 左右どちらか一方の頭(生存している方)から
            // 1発ずつ、毎回発射元を切り替えながらホーミング弾を放つ。
            // 希望する側の頭が既に破壊されていれば、生存側にフォールバック。
            var preferLeft = enemy.nextFiringHeadIsLeft;
            var useLeftHead = preferLeft
              ? enemy.leftHp > 0 || !(enemy.rightHp > 0)
              : !(enemy.rightHp > 0) && enemy.leftHp > 0;
            var firingHeadName = useLeftHead ? "leftHead" : "rightHead";
            var firingHeadPos = new THREE.Vector3();
            enemy.mesh.userData[firingHeadName].getWorldPosition(firingHeadPos);
            spawnHomingMissile(firingHeadPos);
            enemy.nextFiringHeadIsLeft = !enemy.nextFiringHeadIsLeft;
          } else if (enemy.bossType === "sarpedon") {
            // ジェットストリームアタック: 生存しているドムが両バレルから
            // 同時にバズーカ弾を発射する(3体編隊で最大6発の弾幕になる)。
            var doms = enemy.mesh.userData.doms;
            for (var sdi = 0; sdi < doms.length; sdi++) {
              if (enemy.domHp[sdi] <= 0) continue;
              var leftMuzzlePos = new THREE.Vector3();
              var rightMuzzlePos = new THREE.Vector3();
              doms[sdi].userData.leftMuzzle.getWorldPosition(leftMuzzlePos);
              doms[sdi].userData.rightMuzzle.getWorldPosition(rightMuzzlePos);
              firePlayerDirected(leftMuzzlePos);
              firePlayerDirected(rightMuzzlePos);
            }
          } else if (enemy.bossType === "tomos") {
            fireFan(enemy.mesh.position, 8, Math.PI * 0.7);
          } else if (enemy.bossType === "barbarian") {
            var mouthWorldPos = new THREE.Vector3();
            enemy.mesh.userData.mouth.getWorldPosition(mouthWorldPos);
            spawnRippleMissile(mouthWorldPos);
            // リップル発射の瞬間だけ口を大きく開ける。この間に開いた口へ
            // 命中すると弱点扱いで大ダメージになる。
            enemy.mouthOpenTimer = BARBARIAN_MOUTH_OPEN_SECONDS;
          } else if (enemy.bossType === "final") {
            // 第2形態(HP50%以下)ではリング全体が高速回転しており、
            // 弾数を増やしほぼ全方位の扇状弾幕に強化する(ラスボスらしい
            // 圧力を出すため、第1形態よりも明確に苛烈にする)。
            var hpRatio = enemy.hp / enemy.maxHp;
            if (hpRatio <= 0.5) {
              fireFan(enemy.mesh.position, 16, Math.PI * 1.4);
            } else {
              fireFan(enemy.mesh.position, 10, Math.PI * 0.9);
            }
          } else {
            fireFan(enemy.mesh.position, 5, Math.PI / 3);
          }
        }

        function spawnExplosion(position, scale) {
          playExplosionSound();
          var particleCount = 12;
          for (var i = 0; i < particleCount; i++) {
            var geo = new THREE.SphereGeometry(0.12 * (scale || 1), 6, 6);
            var mat = new THREE.MeshBasicMaterial({
              color: i % 2 === 0 ? 0xffaa00 : 0xff4400,
              transparent: true,
              opacity: 1,
            });
            var mesh = new THREE.Mesh(geo, mat);
            mesh.position.copy(position);
            scene.add(mesh);
            var angle = (i / particleCount) * Math.PI * 2;
            var speed = 3 + Math.random() * 4;
            explosions.push({
              mesh: mesh,
              life: 0.5 + Math.random() * 0.3,
              maxLife: 0.8,
              vel: new THREE.Vector3(
                Math.cos(angle) * speed,
                Math.sin(angle) * speed,
                (Math.random() - 0.5) * speed,
              ),
            });
          }
          cameraShake = Math.max(cameraShake, 0.3 * (scale || 1));
        }

        // ボス撃破は原作同様の派手さを出すため、位置をランダムにずらしながら
        // 多段で爆発させる(単発より画面映えする)。
        function spawnBossDefeatExplosions(position) {
          var burstCount = 6;
          for (var i = 0; i < burstCount; i++) {
            (function (index) {
              setTimeout(function () {
                var offset = new THREE.Vector3(
                  (Math.random() - 0.5) * 4,
                  (Math.random() - 0.5) * 4,
                  (Math.random() - 0.5) * 2,
                );
                spawnExplosion(position.clone().add(offset), 2 + index * 0.3);
              }, index * 120);
            })(i);
          }
        }

        function loadHighScore() {
          try {
            var raw = window.localStorage.getItem(HIGH_SCORE_STORAGE_KEY);
            var value = raw ? parseInt(raw, 10) : 0;
            return isNaN(value) ? 0 : value;
          } catch (e) {
            return 0;
          }
        }

        function saveHighScoreIfBeaten(candidateScore) {
          var current = loadHighScore();
          if (candidateScore > current) {
            try {
              window.localStorage.setItem(
                HIGH_SCORE_STORAGE_KEY,
                String(candidateScore),
              );
            } catch (e) {
              // localStorageが使用できない環境では保存をスキップする
            }
            return candidateScore;
          }
          return current;
        }

        function refreshHighScoreDisplay() {
          document.getElementById("high-score-display").textContent =
            "HIGH SCORE: " + loadHighScore();
        }

        function registerKillForCombo() {
          comboCount += 1;
          comboResetTimer = COMBO_WINDOW_SECONDS;
          var comboDisplay = document.getElementById("combo-display");
          if (comboCount >= 2) {
            comboDisplay.textContent = comboCount + " HIT COMBO!";
            comboDisplay.classList.add("visible");
          }
        }

        function resetCombo() {
          comboCount = 0;
          comboResetTimer = 0;
          document.getElementById("combo-display").classList.remove("visible");
        }

        function showScorePopup(worldPosition, amount, isBossDefeat) {
          var projected = worldPosition.clone().project(camera);
          var screenX = ((projected.x + 1) / 2) * window.innerWidth;
          var screenY = ((1 - projected.y) / 2) * window.innerHeight;

          var popup = document.createElement("div");
          popup.className = isBossDefeat
            ? "score-popup boss-defeat"
            : "score-popup";
          popup.textContent = "+" + amount;
          popup.style.left = screenX + "px";
          popup.style.top = screenY + "px";
          document.getElementById("canvas-container").appendChild(popup);
          setTimeout(function () {
            popup.remove();
          }, 1000);
        }

        function updateHud() {
          document.getElementById("score-display").textContent =
            "SCORE: " + score;
          document.getElementById("lives-display").textContent =
            "LIVES: " + lives;
        }

        function flashDamage() {
          var flash = document.getElementById("flash-overlay");
          flash.style.transition = "none";
          flash.style.opacity = "0.6";
          requestAnimationFrame(function () {
            flash.style.transition = "opacity 0.3s ease";
            flash.style.opacity = "0";
          });
        }

        var clock = new THREE.Clock();

        var titleAnimTime = 0;

        function updateGameOverTimers(dt) {
          if (gameOverInputLockTimer > 0) {
            gameOverInputLockTimer -= dt;
          }
          if (gameOverAutoReturnTimer > 0) {
            gameOverAutoReturnTimer -= dt;
            if (gameOverAutoReturnTimer <= 0) {
              returnToTitleFromGameOver();
            }
          }
        }

        function renderTitleScreen() {
          document.getElementById("message-overlay").innerHTML =
            '<h1>STELLAR HARRIER</h1><div id="high-score-display">HIGH SCORE: ' +
            loadHighScore() +
            "</div><p>移動: [矢印キー] or [WASD] or [テンキー] or [マウスドラッグ]</p>" +
            "<p>ショット: [スペースキー] or [マウスクリック]</p>" +
            '<button id="start-button" type="button">START</button>';
          document.getElementById("start-button").onclick = startGame;
        }

        function returnToTitleFromGameOver() {
          state = STATE_READY;
          stopBgmAndSilence();
          renderTitleScreen();
        }

        function loop() {
          requestAnimationFrame(loop);
          var dt = Math.min(clock.getDelta(), 0.05);

          if (state === STATE_PLAYING) {
            update(dt);
          }

          if (state === STATE_ENDING) {
            updateEnding(dt);
          }

          if (state === STATE_GAMEOVER) {
            updateGameOverTimers(dt);
          }

          if (state === STATE_READY || state === STATE_STAGE_SELECT) {
            titleAnimTime += dt;
            camera.position.x = Math.sin(titleAnimTime * 0.3) * 3;
            camera.position.y = 2.2 + Math.sin(titleAnimTime * 0.5) * 0.5;
            camera.lookAt(0, 2, -40);
            if (starField) {
              starField.rotation.y += dt * 0.05;
            }
          } else if (starField) {
            starField.rotation.y += dt * 0.01;
          }

          applyCameraShake(dt);
          applyBossZoom(dt);
          renderer.render(scene, camera);
        }

        function applyCameraShake(dt) {
          if (state === STATE_READY || state === STATE_STAGE_SELECT) return;
          if (cameraShake > 0) {
            cameraShake = Math.max(0, cameraShake - dt * 1.5);
            camera.position.x = (Math.random() - 0.5) * cameraShake;
            camera.position.y = 2.2 + (Math.random() - 0.5) * cameraShake;
          } else {
            camera.position.x = 0;
            camera.position.y = 2.2;
          }
        }

        // ボス登場時、FOVを素早く狭めてからゆっくり元に戻す疑似ズームイン。
        // 前半40%でズームイン、残りでズームアウトする単純なイーズ。
        function applyBossZoom(dt) {
          if (bossZoomTimer <= 0) return;
          bossZoomTimer = Math.max(0, bossZoomTimer - dt);
          var progress = 1 - bossZoomTimer / BOSS_ZOOM_DURATION;
          var zoomAmount;
          if (progress < 0.4) {
            zoomAmount = progress / 0.4;
          } else {
            zoomAmount = 1 - (progress - 0.4) / 0.6;
          }
          camera.fov = BASE_FOV - (BASE_FOV - BOSS_ZOOM_FOV) * zoomAmount;
          camera.updateProjectionMatrix();
          if (bossZoomTimer <= 0) {
            camera.fov = BASE_FOV;
            camera.updateProjectionMatrix();
          }
        }

        // キーボード/マウス/タッチによる自機のXY移動を反映する。通常の
        // プレイ中(update)だけでなく、エンディングの巡航フェーズでも
        // 同じ操作性を使うため共通関数として切り出す。
        function updatePlayerMovement(dt) {
          var accel = 26;
          // テンキー(8:上 4:左 6:右 2:下)にも対応する。
          if (keys["ArrowLeft"] || keys["KeyA"] || keys["Numpad4"]) {
            playerVel.x -= accel * dt;
          }
          if (keys["ArrowRight"] || keys["KeyD"] || keys["Numpad6"]) {
            playerVel.x += accel * dt;
          }
          if (keys["ArrowUp"] || keys["KeyW"] || keys["Numpad8"]) {
            playerVel.y += accel * dt;
          }
          if (keys["ArrowDown"] || keys["KeyS"] || keys["Numpad2"]) {
            playerVel.y -= accel * dt;
          }
          playerVel.x *= 0.9;
          playerVel.y *= 0.9;

          if (pointerActive) {
            playerPos.x +=
              (pointerTarget.x - playerPos.x) * Math.min(1, dt * 6);
            playerPos.y +=
              (pointerTarget.y - playerPos.y) * Math.min(1, dt * 6);
          } else {
            playerPos.x += playerVel.x * dt;
            playerPos.y += playerVel.y * dt;
          }

          playerPos = clampPosition(playerPos, PLAYER_BOUNDS);
          playerGroup.position.x = playerPos.x;
          playerGroup.position.y = playerPos.y;
          playerGroup.rotation.z = -playerVel.x * 0.06;
          playerGroup.rotation.x = playerVel.y * 0.03;
        }

        function update(dt) {
          elapsedTime += dt;
          if (invulnerableTimer > 0) {
            invulnerableTimer -= dt;
            player.visible = Math.floor(elapsedTime * 12) % 2 === 0;
            shieldMesh.visible = true;
            shieldMesh.rotation.y += dt * 4;
            shieldMesh.rotation.x += dt * 2;
          } else {
            player.visible = true;
            shieldMesh.visible = false;
          }

          if (comboResetTimer > 0) {
            comboResetTimer -= dt;
            if (comboResetTimer <= 0) {
              resetCombo();
            }
          }

          updatePlayerMovement(dt);

          groundOffset += GROUND_SPEED * dt;
          if (groundMesh && groundMesh.material.map) {
            groundMesh.material.map.offset.y = groundOffset * 0.03;
          }

          while (
            nextSpawnIndex < spawnSchedule.length &&
            spawnSchedule[nextSpawnIndex].time <= elapsedTime
          ) {
            var ev = spawnSchedule[nextSpawnIndex];
            if (ev.kind === "boss") {
              // ボスは即座に出現させず、警告演出(音+WARNING表示+ボス名)を
              // 挟んでから少し遅れて出現させる。ゲーム内時間(elapsedTime)
              // 基準で遅延させることで、ポーズ中は演出も止まる。
              // 通常ステージのボスイベントはbossTypeを持たず、spawnEnemy
              // 側と同じくcurrentStage.bossTypeにフォールバックする
              // (このフォールバックをしないとボス名が常に既定値"BOSS"に
              // なってしまう)。
              var warningBossType = ev.bossType || currentStage.bossType;
              showBossWarning(BOSS_NAME_BY_TYPE[warningBossType] || "BOSS");
              pendingBossSpawns.push({
                time: elapsedTime + BOSS_WARNING_DURATION_MS / 1000,
                laneX: ev.laneX,
                bossType: warningBossType,
              });
            } else {
              spawnEnemy(ev.kind, ev.laneX, ev.bossType);
            }
            nextSpawnIndex += 1;
          }

          for (var pbi = pendingBossSpawns.length - 1; pbi >= 0; pbi--) {
            var pending = pendingBossSpawns[pbi];
            if (pending.time <= elapsedTime) {
              spawnEnemy("boss", pending.laneX, pending.bossType);
              pendingBossSpawns.splice(pbi, 1);
            }
          }

          while (
            nextObstacleIndex < obstacleSchedule.length &&
            obstacleSchedule[nextObstacleIndex].time <= elapsedTime
          ) {
            var ob = obstacleSchedule[nextObstacleIndex];
            spawnObstacle(ob.kind, ob.laneX);
            nextObstacleIndex += 1;
          }

          updateBullets(dt);
          updateEnemies(dt);
          updateObstacles(dt);
          updateEnemyBullets(dt);
          updateExplosions(dt);

          if (stageTransitionTimer > 0) {
            // 次ステージへの遷移待ち(ファンファーレ演出中)。この間も
            // ゲームを止めずに現ステージの描画・自機操作を続けさせるため、
            // stageCompleteの再判定はスキップする。
            stageTransitionTimer -= dt;
            if (stageTransitionTimer <= 0) {
              advanceToNextStage();
            }
          } else {
            var stageComplete =
              !bossTestModeActive &&
              (currentStage.bossSequence
                ? bossRushAllDefeated && enemies.length === 0
                : elapsedTime >= currentStage.durationSeconds &&
                  enemies.length === 0);
            if (stageComplete && state === STATE_PLAYING) {
              clearAllEnemiesAndAdvance();
            }
          }
        }

        function updateBullets(dt) {
          for (var bi = bullets.length - 1; bi >= 0; bi--) {
            var b = bullets[bi];
            b.mesh.position.z -= b.speed * dt;
            if (b.mesh.position.z < -160) {
              scene.remove(b.mesh);
              bullets.splice(bi, 1);
            }
          }
        }

        // JET STREAM DOMS(サルペドン)専用: 通常は左右にうねりながら飛行
        // するが、一定間隔で「素早い左右横移動→静止→予兆(赤く点滅)→
        // 縦方向に放物線を描きながら自機の位置へジャンプして着地→また
        // 奥へ戻る」演出を挟む。ジャンプ先(X/Y/Z)は予兆終了時点の自機
        // 位置で固定するため、予兆中に自機が動けば着地点がズレて避けられる。
        var SARPEDON_SLIDE_DURATION_SECONDS = 0.35;
        var SARPEDON_JUMP_CHARGE_SECONDS = 0.6;
        var SARPEDON_JUMP_DURATION_SECONDS = 0.7;
        var SARPEDON_JUMP_HEIGHT = 6;
        var SARPEDON_RETURN_DURATION_SECONDS = 0.8;

        function updateSarpedonPerformance(en, dt) {
          var doms = en.mesh.userData.doms;

          if (en.dashState === "idle") {
            en.dashTimer -= dt;
            for (var i = 0; i < doms.length; i++) {
              var domMesh = doms[i];
              if (en.domHp[i] <= 0) continue;
              domMesh.position.x = Math.sin(elapsedTime * 2.4 - i * 0.6) * 3;
              domMesh.rotation.z = Math.sin(elapsedTime * 2.4 - i * 0.6) * 0.2;
              var thrusterFlicker =
                0.6 + Math.abs(Math.sin(elapsedTime * 12 + i)) * 0.4;
              domMesh.userData.thruster.material.opacity = thrusterFlicker;
            }
            if (en.dashTimer <= 0) {
              en.dashState = "sliding";
              en.dashTimer = SARPEDON_SLIDE_DURATION_SECONDS;
              en.dashProgress = 0;
              en.jumpOrigin.copy(en.mesh.position);
              // 編隊ごと画面内のランダムなX位置へ素早く横移動する
              // (ジャンプ前の予備動作として、回避のリズムを崩す)。
              en.jumpTarget.set(
                PLAYER_BOUNDS.minX +
                  Math.random() * (PLAYER_BOUNDS.maxX - PLAYER_BOUNDS.minX),
                en.mesh.position.y,
                en.mesh.position.z,
              );
            }
          } else if (en.dashState === "sliding") {
            en.dashProgress = Math.min(
              1,
              en.dashProgress + dt / SARPEDON_SLIDE_DURATION_SECONDS,
            );
            var slideP = en.dashProgress;
            // 急加速→急停止のイージングで「素早い」横移動感を出す。
            var easedSlide = 1 - Math.pow(1 - slideP, 3);
            en.mesh.position.x =
              en.jumpOrigin.x +
              (en.jumpTarget.x - en.jumpOrigin.x) * easedSlide;
            for (var si = 0; si < doms.length; si++) {
              if (en.domHp[si] <= 0) continue;
              doms[si].rotation.z =
                Math.sign(en.jumpTarget.x - en.jumpOrigin.x) * -0.4;
              doms[si].userData.thruster.material.opacity = 1;
            }
            if (en.dashProgress >= 1) {
              en.baseX = en.mesh.position.x;
              en.dashState = "charging";
              en.dashTimer = SARPEDON_JUMP_CHARGE_SECONDS;
            }
          } else if (en.dashState === "charging") {
            en.dashTimer -= dt;
            // 予兆演出: スラスターを激しく明滅させ、ジャンプ直前であることを
            // 示す(この間に自機が動けば着地点もそれに応じて変わる)。
            var chargeFlicker =
              Math.abs(Math.sin(elapsedTime * 25)) * 0.5 + 0.5;
            for (var ci = 0; ci < doms.length; ci++) {
              if (en.domHp[ci] <= 0) continue;
              doms[ci].userData.thruster.material.opacity = chargeFlicker;
            }
            if (en.dashTimer <= 0) {
              en.dashState = "jumping";
              en.dashTimer = SARPEDON_JUMP_DURATION_SECONDS;
              en.dashProgress = 0;
              en.jumpOrigin.copy(en.mesh.position);
              // 着地点は予兆終了時点の自機位置(この後自機が動けば避けられる)。
              // Zは自機のすぐ奥側に着地させ、自機と重ならないようにする。
              en.jumpTarget.set(
                Math.max(
                  PLAYER_BOUNDS.minX,
                  Math.min(PLAYER_BOUNDS.maxX, playerGroup.position.x),
                ),
                Math.max(
                  PLAYER_BOUNDS.minY,
                  Math.min(PLAYER_BOUNDS.maxY, playerGroup.position.y),
                ),
                playerGroup.position.z - 4,
              );
            }
          } else if (en.dashState === "jumping") {
            en.dashProgress = Math.min(
              1,
              en.dashProgress + dt / SARPEDON_JUMP_DURATION_SECONDS,
            );
            var p = en.dashProgress;
            // XZは線形補間、Yは放物線(sin波で山なりの弧を描く)。
            en.mesh.position.lerpVectors(en.jumpOrigin, en.jumpTarget, p);
            var arc = Math.sin(p * Math.PI) * SARPEDON_JUMP_HEIGHT;
            en.mesh.position.y = en.jumpOrigin.y + arc;
            for (var di = 0; di < doms.length; di++) {
              if (en.domHp[di] <= 0) continue;
              doms[di].position.x = 0;
              doms[di].rotation.z = 0;
              // 上昇中は前傾、下降中は後傾させ、ジャンプの勢いを表現する。
              doms[di].rotation.x = Math.cos(p * Math.PI) * 0.5;
              doms[di].userData.thruster.material.opacity = 1;
            }
            if (en.dashProgress >= 1) {
              en.dashState = "landed";
              en.dashTimer = 0.3;
              spawnExplosion(en.mesh.position, 1.2);
              cameraShake = Math.max(cameraShake, 0.4);
            }
          } else if (en.dashState === "landed") {
            en.dashTimer -= dt;
            if (en.dashTimer <= 0) {
              en.dashState = "returning";
              en.dashTimer = SARPEDON_RETURN_DURATION_SECONDS;
              en.dashProgress = 0;
              en.jumpOrigin.copy(en.mesh.position);
              var returnZ = en.engageZ !== undefined ? en.engageZ : -20;
              en.jumpTarget.set(en.baseX, en.homeY, returnZ);
            }
          } else if (en.dashState === "returning") {
            en.dashProgress = Math.min(
              1,
              en.dashProgress + dt / SARPEDON_RETURN_DURATION_SECONDS,
            );
            var pr = en.dashProgress;
            var easedBack = pr * pr * (3 - 2 * pr);
            en.mesh.position.lerpVectors(
              en.jumpOrigin,
              en.jumpTarget,
              easedBack,
            );
            for (var ri = 0; ri < doms.length; ri++) {
              if (en.domHp[ri] <= 0) continue;
              doms[ri].rotation.x = 0;
              var backFlicker =
                0.6 + Math.abs(Math.sin(elapsedTime * 12 + ri)) * 0.4;
              doms[ri].userData.thruster.material.opacity = backFlicker;
            }
            if (en.dashProgress >= 1) {
              en.dashState = "idle";
              en.dashTimer = 3 + Math.random() * 3;
            }
          }
        }

        // ボス種別ごとの固有演出(頭部の生死表現・花弁開閉・リング回転など)。
        // ゴダーニ/サルペドンは原作同様「常に正面(自機側)を向く」ため、
        // スケイラのようなZ往復や横回転は行わない。
        function updateBossPerformance(en, dt) {
          if (en.bossType === "godani") {
            // 頭部だけでなく首(neck)ごと非表示にすることで、撃破した側の
            // 首がちぎれて丸ごと無くなったように見せる。
            en.mesh.userData.leftUnit.visible = en.leftHp > 0;
            en.mesh.userData.rightUnit.visible = en.rightHp > 0;
            en.mesh.rotation.y = Math.sin(elapsedTime * 1.2) * 0.15;

            // 左右それぞれの首を、互いに位相をずらしてゆらゆらと揺らす
            // (伸びた首が生き物らしく揺れる演出)。
            var leftUnit = en.mesh.userData.leftUnit;
            var leftNeck = leftUnit.userData.neckPivot;
            leftNeck.rotation.z =
              leftUnit.userData.neckBaseRotationZ +
              Math.sin(elapsedTime * 1.6) * 0.18;
            leftNeck.rotation.x =
              leftUnit.userData.neckBaseRotationX +
              Math.sin(elapsedTime * 1.3 + 1) * 0.12;

            var rightUnit = en.mesh.userData.rightUnit;
            var rightNeck = rightUnit.userData.neckPivot;
            rightNeck.rotation.z =
              rightUnit.userData.neckBaseRotationZ +
              Math.sin(elapsedTime * 1.6 + Math.PI) * 0.18;
            rightNeck.rotation.x =
              rightUnit.userData.neckBaseRotationX +
              Math.sin(elapsedTime * 1.3 + 1 + Math.PI) * 0.12;

            // 翼を上下にゆっくり羽ばたかせる。
            var wingFlap = Math.sin(elapsedTime * 2.2) * 0.35;
            en.mesh.userData.wingPivotLeft.rotation.x = wingFlap;
            en.mesh.userData.wingPivotRight.rotation.x = wingFlap;

            // 本体は完全静止だと首・翼だけが浮いて動いているように
            // 見えてしまうため、左右にゆっくりドリフトさせる。
            en.wavePhase += dt * GODANI_DRIFT_SPEED;
            en.mesh.position.x = clamp(
              en.baseX + Math.sin(en.wavePhase) * GODANI_DRIFT_AMPLITUDE,
              PLAYER_BOUNDS.minX,
              PLAYER_BOUNDS.maxX,
            );
          } else if (en.bossType === "sarpedon") {
            updateSarpedonPerformance(en, dt);
          } else if (en.bossType === "tomos") {
            var petals = en.mesh.userData.petals;
            for (var pi = 0; pi < petals.length; pi++) {
              var petal = petals[pi];
              var alive = en.petalHp[pi] > 0;
              petal.visible = alive;
              if (alive) {
                // 花弁の根本(ローカルY=0)を花芯の球面上に置き、先端
                // (ローカルY=2.6)が中心から放射状外向きを向くようにする。
                // rotation.zで放射方向へ向け、開閉演出はrotation.x(手前/
                // 奥への反り)で表現することで「垂れ下がる」向きを避ける。
                // 花全体をゆっくり回転させるため、baseAngleに時間経過分の
                // オフセットを加える。
                var rotationOffset = elapsedTime * 0.6;
                var baseAngle = petal.userData.baseAngle + rotationOffset;
                petal.position.set(
                  Math.cos(baseAngle) * 1.1,
                  Math.sin(baseAngle) * 1.1,
                  0,
                );
                petal.rotation.z = baseAngle - Math.PI / 2;
                petal.rotation.x = Math.sin(elapsedTime * 3 + pi) * 0.25;
              }
            }
            var coreGlow = en.coreVulnerable ? 0.8 : 0.1;
            en.mesh.userData.core.material.emissiveIntensity = coreGlow;
            en.mesh.userData.coreDetail.rotation.y += dt * 2;

            // 花全体が完全静止だと回避パターンが単調になるため、茎が
            // 揺れるようなゆったりした左右ドリフトを加える。
            en.wavePhase += dt * TOMOS_DRIFT_SPEED;
            en.mesh.position.x = clamp(
              en.baseX + Math.sin(en.wavePhase) * TOMOS_DRIFT_AMPLITUDE,
              PLAYER_BOUNDS.minX,
              PLAYER_BOUNDS.maxX,
            );
          } else if (en.bossType === "barbarian") {
            // モアイは原作同様に常に正面(自機側)を向いたまま迫る。
            // 目は常時明滅させ、口はリップルミサイルを発射した瞬間だけ
            // 大きく開き、それ以外は軽く閉じた状態にする(発射タイミング
            // = 弱点が露出するタイミング、とわかりやすくする)。
            var pulse = 0.6 + Math.abs(Math.sin(elapsedTime * 3)) * 0.4;
            en.mesh.userData.leftEye.material.emissiveIntensity = pulse;
            en.mesh.userData.rightEye.material.emissiveIntensity = pulse;
            en.mouthOpenTimer = Math.max(0, (en.mouthOpenTimer || 0) - dt);
            en.mouthOpen = en.mouthOpenTimer > 0;
            var mouthOpenAmount = en.mouthOpen ? 1 : 0;
            en.mesh.userData.upperLip.position.y = -1.5 - mouthOpenAmount * 0.5;
            en.mesh.userData.lowerLip.position.y =
              -2.15 + mouthOpenAmount * 0.5;
            // 画面内で跳ねる動作。1回ごとにジャンプの高さをランダムに
            // 決め、放物線(sin波)で1サイクル分の跳躍を描く。着地したら
            // 次のジャンプの高さを再抽選する。最大は画面外に出るほどの
            // 大跳躍になることもある。
            en.bouncePhase = (en.bouncePhase || 0) + dt * MOAI_BOUNCE_SPEED;
            if (en.bouncePhase >= 1) {
              en.bouncePhase -= 1;
              en.bounceHeight =
                MOAI_BOUNCE_MIN_HEIGHT +
                Math.random() *
                  (MOAI_BOUNCE_MAX_HEIGHT - MOAI_BOUNCE_MIN_HEIGHT);
            }
            if (en.bounceHeight === undefined) {
              en.bounceHeight = MOAI_BOUNCE_MIN_HEIGHT;
            }
            var bounce = Math.sin(en.bouncePhase * Math.PI) * en.bounceHeight;
            en.mesh.position.y = (en.homeY || 0) + bounce;
          } else if (en.bossType === "final") {
            // 第2形態(HP50%以下)はリングの回転速度とコアの発光が増し、
            // 弾幕強化(fireAtPlayer側)と連動して見た目にも「怒り状態」が
            // わかるようにする。
            var enraged = en.hp / en.maxHp <= 0.5;
            var ringSpeedMul = enraged ? 2.5 : 1;
            en.mesh.userData.ring1.rotation.z += dt * 1.5 * ringSpeedMul;
            en.mesh.userData.ring2.rotation.z += dt * -1.2 * ringSpeedMul;
            en.mesh.userData.core.rotation.y += dt * 2 * ringSpeedMul;
            en.mesh.userData.core.material.emissiveIntensity = enraged
              ? 0.9 + Math.abs(Math.sin(elapsedTime * 8)) * 0.3
              : 0.6;
          } else {
            en.mesh.rotation.y += dt * 1.5;
          }
        }

        function updateEnemies(dt) {
          for (var ei = enemies.length - 1; ei >= 0; ei--) {
            var en = enemies[ei];
            var isScaler = en.kind === "boss" && en.bossType === "scaler";

            if (isScaler) {
              // スケイラ(龍): 画面手前(-10)と、自機よりもさらに奥(-160)の
              // 間を大きくZ方向に往復しながら、頭を中心に画面いっぱいを
              // 使う8の字(無限大マーク)を描いて空を泳ぐように動く。
              en.mesh.position.z += en.speed * en.swoopDir * dt;
              if (en.mesh.position.z > SCALER_NEAR_TURN_Z) {
                // 位置をぴったり折り返し地点にクランプし、1フレームの
                // 移動量ぶんオーバーシュートして描画が飛んで見える現象を防ぐ。
                en.mesh.position.z = SCALER_NEAR_TURN_Z;
                en.swoopDir = -1;
                // 奥へ戻る(後退)ときは体がグループの-Z方向に連なった
                // ままだと尻尾が先頭になってしまうため、グループ全体を
                // 180度反転させ、常に頭が進行方向を向くようにする。
                en.mesh.rotation.y = Math.PI;
              } else if (en.mesh.position.z < SCALER_DEEP_RETREAT_Z) {
                en.mesh.position.z = SCALER_DEEP_RETREAT_Z;
                en.swoopDir = 1;
                en.mesh.rotation.y = 0;
              }
              // 遠く奥まで潜っている間(深い後退中)は火炎(弾)を休止し、
              // 大胆な遊泳演出に専念させる。
              en.scalerFireSuspended =
                en.mesh.position.z < SCALER_FIRE_SUSPEND_Z;
              en.wavePhase += dt * 1.1;
              // 横8の字(リサージュ曲線): X方向はsin(θ)、Y方向はsin(2θ)にする
              // ことで、左右に揺れながら上下にも複合的に動く画面いっぱいの
              // 軌道になる。
              en.mesh.position.x = clamp(
                en.baseX + Math.sin(en.wavePhase) * en.waveAmplitude,
                PLAYER_BOUNDS.minX - 4,
                PLAYER_BOUNDS.maxX + 4,
              );
              en.mesh.position.y = clamp(
                (en.homeY || 0) +
                  Math.sin(en.wavePhase * 2) * (en.waveAmplitude * 0.55),
                // 地面(Y=-4)に胴体が潜らないよう、下限は地面より高い位置に
                // クランプする。
                SCALER_GROUND_CLEARANCE_Y,
                PLAYER_BOUNDS.maxY + 4,
              );
              var segments = en.mesh.userData.segments;
              for (var si = 0; si < segments.length; si++) {
                // 体節ごとの位相ずれを緩やかにし、うねりの振幅も拡大する
                // ことで、蛇行が「くねくねと流れてくる」ように見える大胆な
                // 動きにする。
                segments[si].position.x =
                  Math.sin(en.wavePhase - si * 0.35) * 2.6;
                segments[si].position.y =
                  Math.sin((en.wavePhase - si * 0.35) * 2) * 1.3;
              }
            } else if (en.kind === "boss") {
              // スケイラ以外のボスも、画面奥と交戦距離の間をZ方向に往復
              // させることで回避の間合いを生む。交戦距離(手前側の折り返し
              // 地点)はボスごとに異なる範囲からランダムに選び、初回接近時に
              // 一度だけ決定する(en.engageZが未設定の初回のみ抽選)。
              // ただしJET STREAM DOMSのジャンプ演出中(charging/jumping/
              // landed/returning)は、ジャンプ側がZ/Y位置を専有するため
              // 通常のZ往復を止める。
              var isSarpedonJumping =
                en.bossType === "sarpedon" && en.dashState !== "idle";
              if (!isSarpedonJumping) {
                if (en.engageZ === undefined) {
                  var range = BOSS_ENGAGE_RANGE_BY_TYPE[en.bossType] || [
                    -20, -20,
                  ];
                  en.engageZ = range[0] + Math.random() * (range[1] - range[0]);
                }
                var BOSS_RETREAT_Z = -90;
                en.mesh.position.z += en.speed * en.swoopDir * dt;
                if (en.mesh.position.z > en.engageZ) {
                  en.mesh.position.z = en.engageZ;
                  en.swoopDir = -1;
                } else if (en.mesh.position.z < BOSS_RETREAT_Z) {
                  en.mesh.position.z = BOSS_RETREAT_Z;
                  en.swoopDir = 1;
                }
              }
              updateBossPerformance(en, dt);
            } else {
              en.mesh.position.z += en.speed * dt;
              en.wavePhase += en.waveSpeed * dt;
              en.verticalWavePhase += en.verticalWaveSpeed * dt;
              en.mesh.position.x =
                en.baseX + Math.sin(en.wavePhase) * en.waveAmplitude;
              en.mesh.position.y =
                en.baseY +
                Math.sin(en.verticalWavePhase) * en.verticalWaveAmplitude;
            }

            if (en.kind === "dom") {
              en.mesh.rotation.y = Math.sin(elapsedTime * 1.5) * 0.3;
            } else if (en.kind === "tomos") {
              var jawAngle = Math.abs(Math.sin(elapsedTime * 10)) * 0.6;
              en.mesh.userData.upperJaw.rotation.x = jawAngle;
              en.mesh.userData.lowerJaw.rotation.x = -jawAngle;
            } else if (en.kind === "dasher") {
              // 速さを強調するため、機体をわずかに傾けつつスラスターを
              // 激しく明滅させる。
              en.mesh.rotation.z = Math.sin(elapsedTime * 8) * 0.15;
              en.mesh.userData.thruster.material.opacity =
                0.6 + Math.abs(Math.sin(elapsedTime * 20)) * 0.4;
            } else if (en.kind === "weaver") {
              // 頭の後ろに続く体節を、頭の蛇行より少し遅れた位相で揺らし、
              // 蛇がうねりながら泳ぐような動きにする。
              var weaverSegments = en.mesh.userData.segments;
              for (var wi = 0; wi < weaverSegments.length; wi++) {
                weaverSegments[wi].position.x =
                  Math.sin(en.wavePhase - (wi + 1) * 0.8) * 0.6;
              }
            } else if (!isScaler && en.kind !== "boss") {
              en.mesh.rotation.y += dt * 2;
            }
            en.fireTimer -= dt;
            var canFire =
              en.kind === "dom" ||
              en.kind === "boss" ||
              en.kind === "shooter" ||
              en.kind === "weaver";
            var zThreshold = isScaler ? SCALER_DEEP_RETREAT_Z : -100;
            if (
              canFire &&
              en.fireTimer <= 0 &&
              en.mesh.position.z > zThreshold &&
              !en.scalerFireSuspended
            ) {
              fireAtPlayer(en);
              var isFinalBossEnraged =
                en.bossType === "final" && en.hp / en.maxHp <= 0.5;
              var baseInterval;
              if (isScaler) {
                // 火炎放射のイメージ: 短い間隔の連続弾(ブレス)を数発放った
                // 後、長めの休止を挟んでまた次のブレスを吐く、という
                // 「常時発射ではない断続的な炎」のパターンにする。
                en.scalerBreathShotsLeft =
                  en.scalerBreathShotsLeft === undefined
                    ? 0
                    : en.scalerBreathShotsLeft;
                if (en.scalerBreathShotsLeft > 0) {
                  en.scalerBreathShotsLeft -= 1;
                  baseInterval = SCALER_BREATH_SHOT_INTERVAL;
                } else {
                  en.scalerBreathShotsLeft = SCALER_BREATH_SHOT_COUNT - 1;
                  baseInterval = SCALER_BREATH_PAUSE_INTERVAL;
                }
              } else {
                baseInterval =
                  en.bossType === "sarpedon"
                    ? 2.2
                    : en.bossType === "barbarian"
                      ? 1.6
                      : isFinalBossEnraged
                        ? 0.9
                        : en.kind === "boss"
                          ? 1.4
                          : 2.5;
              }
              en.fireTimer = baseInterval / getDifficultyMultiplier();
            }

            if (en.mesh.position.z > 12) {
              scene.remove(en.mesh);
              enemies.splice(ei, 1);
              continue;
            }

            var scalerTurnaroundInvuln =
              isScaler &&
              en.mesh.position.z > SCALER_NEAR_TURN_Z - SCALER_TURN_SAFE_MARGIN;
            if (invulnerableTimer <= 0 && !scalerTurnaroundInvuln) {
              var hitPlayer = circlesIntersect(
                {
                  x: en.mesh.position.x,
                  y: en.mesh.position.y,
                  radius: en.radius,
                },
                {
                  x: playerGroup.position.x,
                  y: playerGroup.position.y,
                  radius: 0.6,
                },
              );
              var withinCollisionZ =
                Math.abs(en.mesh.position.z - playerGroup.position.z) <
                en.radius + 1;
              if (hitPlayer && withinCollisionZ) {
                if (en.kind === "boss") {
                  // ボスは体当たりで倒せない(原作同様、撃破は自弾のみ)。
                  // 自機はダメージを受けるが、ボスは消滅させない。
                  damagePlayer();
                } else {
                  spawnExplosion(en.mesh.position, 1.5);
                  scene.remove(en.mesh);
                  enemies.splice(ei, 1);
                  damagePlayer();
                  continue;
                }
              }
            }

            for (var bj = bullets.length - 1; bj >= 0; bj--) {
              var bullet = bullets[bj];
              var hitBullet = circlesIntersect(
                {
                  x: en.mesh.position.x,
                  y: en.mesh.position.y,
                  radius: en.radius,
                },
                {
                  x: bullet.mesh.position.x,
                  y: bullet.mesh.position.y,
                  radius: 0.15,
                },
              );
              if (
                hitBullet &&
                Math.abs(en.mesh.position.z - bullet.mesh.position.z) <
                  en.radius + 1
              ) {
                if (!applyBulletDamage(en, bullet)) {
                  // トモスの花弁ガードに阻まれた等、本体無効ヒットの場合は
                  // 弾を消費するが敵は倒れない
                  scene.remove(bullet.mesh);
                  bullets.splice(bj, 1);
                  break;
                }
                scene.remove(bullet.mesh);
                bullets.splice(bj, 1);
                playHitSound();
                if (en.kind === "boss") {
                  updateBossHpBar(en);
                }
                if (isBossDefeated(en)) {
                  registerKillForCombo();
                  stats.enemiesDefeated += 1;
                  if (en.kind === "boss") {
                    stats.bossesDefeated += 1;
                  }
                  stats.maxCombo = Math.max(stats.maxCombo, comboCount);
                  var comboMultiplier = 1 + Math.min(comboCount - 1, 9) * 0.1;
                  var gainedScore = Math.round(
                    scoreForEnemy(en.kind) * comboMultiplier,
                  );
                  score += gainedScore;
                  updateHud();
                  showScorePopup(
                    en.mesh.position,
                    gainedScore,
                    en.kind === "boss",
                  );
                  if (en.kind === "boss") {
                    spawnBossDefeatExplosions(en.mesh.position);
                  } else {
                    spawnExplosion(en.mesh.position, 1);
                  }
                  scene.remove(en.mesh);
                  enemies.splice(ei, 1);
                  if (en.kind === "boss") {
                    hideBossHpBar();
                    if (bossTestModeActive) {
                      // ボステストモードでは撃破直後に同じボスを再出現させ、
                      // 何度でも連続で練習・検証できるようにする。警告演出
                      // も本編と同じ流れで確認できるよう挟む。
                      setTimeout(function () {
                        if (bossTestModeActive) {
                          showBossWarning(
                            BOSS_NAME_BY_TYPE[bossTestBossType] || "BOSS",
                          );
                          setTimeout(function () {
                            if (bossTestModeActive) {
                              spawnEnemy("boss", 0, bossTestBossType);
                            }
                          }, BOSS_WARNING_DURATION_MS);
                        }
                      }, 1500);
                    } else if (currentStage.bossSequence) {
                      var bossRushCleared = advanceBossRush();
                      if (bossRushCleared) {
                        bossRushAllDefeated = true;
                      }
                    }
                  }
                }
                break;
              }
            }
          }
        }

        // 弾のヒットをenemyのHP構造(通常/左右独立/花弁ガード)に応じて適用する。
        // 戻り値はダメージが有効に通ったか(falseなら本体無効ヒット)。
        // 命中判定でワールド座標を取得する際に使い回すスクラッチ用
        // ベクトル(毎回newせず、GCプレッシャーを避けるため)。
        var scratchVector3 = new THREE.Vector3();

        function applyBulletDamage(en, bullet) {
          if (en.domHp !== undefined) {
            // サルペドン: 縦列に並ぶ3体のドムのうち、弾のワールドZ座標に
            // 最も近い(かつ生存している)個体にダメージを与える。
            var doms = en.mesh.userData.doms;
            var closestIndex = -1;
            var closestDist = Infinity;
            for (var di = 0; di < doms.length; di++) {
              if (en.domHp[di] <= 0) continue;
              doms[di].getWorldPosition(scratchVector3);
              var dist = Math.abs(scratchVector3.z - bullet.mesh.position.z);
              if (dist < closestDist) {
                closestDist = dist;
                closestIndex = di;
              }
            }
            if (closestIndex === -1) {
              return false;
            }
            en.domHp[closestIndex] -= 1;
            en.hp = en.domHp.reduce(function (sum, hp) {
              return sum + Math.max(0, hp);
            }, 0);
            return true;
          }

          if (en.leftHp !== undefined) {
            var isLeftSide = bullet.mesh.position.x < en.mesh.position.x;
            if (isLeftSide && en.leftHp > 0) {
              en.leftHp -= 1;
            } else if (!isLeftSide && en.rightHp > 0) {
              en.rightHp -= 1;
            } else if (en.leftHp > 0) {
              en.leftHp -= 1;
            } else {
              en.rightHp -= 1;
            }
            en.hp = en.leftHp + en.rightHp;
            return true;
          }

          if (en.petalHp !== undefined) {
            var remainingPetals = en.petalHp.filter(function (hp) {
              return hp > 0;
            }).length;
            if (remainingPetals > 0) {
              for (var pi = 0; pi < en.petalHp.length; pi++) {
                if (en.petalHp[pi] > 0) {
                  en.petalHp[pi] -= 1;
                  break;
                }
              }
              en.coreVulnerable = en.petalHp.every(function (hp) {
                return hp <= 0;
              });
              return false;
            }
            if (!en.coreVulnerable) {
              return false;
            }
            en.hp -= 1;
            return true;
          }

          if (en.bossType === "barbarian") {
            // 口が開いている(=リップル発射直後)タイミングで、かつ口の
            // 位置に着弾した場合のみ弱点ヒットとして大ダメージにする。
            // それ以外(口が閉じている、または顔の他の部位への着弾)は
            // 通常ダメージにとどめる。
            en.mesh.userData.mouth.getWorldPosition(scratchVector3);
            var hitDist = scratchVector3.distanceTo(bullet.mesh.position);
            var isMouthHit = hitDist < BARBARIAN_MOUTH_HIT_RADIUS;
            if (en.mouthOpen && isMouthHit) {
              en.hp -= BARBARIAN_MOUTH_WEAKPOINT_DAMAGE;
            } else {
              en.hp -= 1;
            }
            return true;
          }

          en.hp -= 1;
          return true;
        }

        function isBossDefeated(en) {
          return en.hp <= 0;
        }

        function updateObstacles(dt) {
          for (var oi = obstacles.length - 1; oi >= 0; oi--) {
            var ob = obstacles[oi];
            ob.mesh.position.z += ob.speed * dt;
            if (ob.mesh.position.z > 12) {
              scene.remove(ob.mesh);
              obstacles.splice(oi, 1);
              continue;
            }
            if (invulnerableTimer <= 0) {
              var hitX =
                Math.abs(ob.mesh.position.x - playerGroup.position.x) <
                ob.radius + 0.6;
              var hitY =
                Math.abs(ob.mesh.position.y - playerGroup.position.y) <
                ob.hitHeight + 0.6;
              var hitZ =
                Math.abs(ob.mesh.position.z - playerGroup.position.z) <
                ob.radius + 1;
              if (hitX && hitY && hitZ) {
                spawnExplosion(ob.mesh.position, 1.2);
                scene.remove(ob.mesh);
                obstacles.splice(oi, 1);
                damagePlayer();
                continue;
              }
            }

            // 自機のビーム(自弾)は障害物を貫通せず、命中した位置で消える。
            for (var bj = bullets.length - 1; bj >= 0; bj--) {
              var bullet = bullets[bj];
              var bulletHitX =
                Math.abs(ob.mesh.position.x - bullet.mesh.position.x) <
                ob.radius + 0.15;
              var bulletHitY =
                Math.abs(ob.mesh.position.y - bullet.mesh.position.y) <
                ob.hitHeight + 0.15;
              var bulletHitZ =
                Math.abs(ob.mesh.position.z - bullet.mesh.position.z) <
                ob.radius + 1;
              if (bulletHitX && bulletHitY && bulletHitZ) {
                spawnExplosion(bullet.mesh.position, 0.5);
                scene.remove(bullet.mesh);
                bullets.splice(bj, 1);
              }
            }
          }
        }

        function updateEnemyBullets(dt) {
          for (var ebi = enemyBullets.length - 1; ebi >= 0; ebi--) {
            var eb = enemyBullets[ebi];
            if (eb.isRipple) {
              eb.travelDistance += eb.speed * dt;
              eb.basePosition.addScaledVector(eb.dir, eb.speed * dt);
              eb.wavePhase += dt * 4;
              var waveOffset = Math.sin(eb.wavePhase) * 1.8;
              eb.mesh.position
                .copy(eb.basePosition)
                .addScaledVector(eb.lateral, waveOffset);
            } else if (eb.isHoming) {
              var toPlayer = new THREE.Vector3()
                .subVectors(playerGroup.position, eb.mesh.position)
                .normalize();
              eb.dir.lerp(toPlayer, eb.homingTurnRate * dt).normalize();
              eb.mesh.position.addScaledVector(eb.dir, eb.speed * dt);
              eb.mesh.lookAt(eb.mesh.position.clone().add(eb.dir));
              eb.mesh.rotateX(Math.PI / 2);
            } else if (eb.isHomingToFixedTarget) {
              // 扇状弾のホーミング演出: 発射時点の自機位置(固定目標)へ
              // 進行方向を徐々に収束させる。現在の自機位置は追わないため、
              // 発射後に自機が動けば普通に避けられる。目標を通過した後は
              // 直進弾になる(距離が近すぎると方向ベクトルが不安定になる
              // ため、ごく近距離ではホーミングを止める)。
              var toTargetVec = new THREE.Vector3().subVectors(
                eb.homingTarget,
                eb.mesh.position,
              );
              if (toTargetVec.lengthSq() > 0.01) {
                eb.dir
                  .lerp(toTargetVec.normalize(), eb.homingTurnRate * dt)
                  .normalize();
              }
              eb.mesh.position.addScaledVector(eb.dir, eb.speed * dt);
            } else {
              eb.mesh.position.addScaledVector(eb.dir, eb.speed * dt);
            }
            if (
              eb.mesh.position.z > 12 ||
              eb.mesh.position.z < -160 ||
              eb.mesh.position.y < -6 ||
              eb.mesh.position.y > 8
            ) {
              // Z方向の到達判定だけでは、ホーミング弾が地面(Y=-4付近)の
              // 下に沈み込んでも消えずに残り続け、後から軌道修正で地面の
              // 下から突然現れるように見えてしまう。Y方向にも妥当な範囲を
              // 超えたら削除する。
              scene.remove(eb.mesh);
              enemyBullets.splice(ebi, 1);
              continue;
            }
            if (invulnerableTimer <= 0) {
              var hitByEnemyBullet = circlesIntersect(
                { x: eb.mesh.position.x, y: eb.mesh.position.y, radius: 0.25 },
                {
                  x: playerGroup.position.x,
                  y: playerGroup.position.y,
                  radius: 0.6,
                },
              );
              var withinZRange =
                Math.abs(eb.mesh.position.z - playerGroup.position.z) < 1.2;
              if (hitByEnemyBullet && withinZRange) {
                scene.remove(eb.mesh);
                enemyBullets.splice(ebi, 1);
                damagePlayer();
                continue;
              }
              // ニアミス演出: 命中はしないが自機のすぐそば(命中判定より
              // 広い半径)を弾が通過した瞬間に一度だけ効果音を鳴らす。
              if (!eb.nearMissPlayed && withinZRange) {
                var nearMiss = circlesIntersect(
                  {
                    x: eb.mesh.position.x,
                    y: eb.mesh.position.y,
                    radius: 0.25,
                  },
                  {
                    x: playerGroup.position.x,
                    y: playerGroup.position.y,
                    radius: 1.4,
                  },
                );
                if (nearMiss) {
                  eb.nearMissPlayed = true;
                  playNearMissSound();
                }
              }
            }
          }
        }

        function updateExplosions(dt) {
          for (var xi = explosions.length - 1; xi >= 0; xi--) {
            var ex = explosions[xi];
            ex.life -= dt;
            ex.mesh.position.addScaledVector(ex.vel, dt);
            ex.vel.multiplyScalar(0.94);
            ex.mesh.material.opacity = Math.max(0, ex.life / ex.maxLife);
            if (ex.life <= 0) {
              scene.remove(ex.mesh);
              explosions.splice(xi, 1);
            }
          }
        }

        function damagePlayer() {
          if (invulnerableTimer > 0 || invincibleModeActive) return;
          lives = Math.max(0, lives - 1);
          invulnerableTimer = 2;
          stats.hitsTaken += 1;
          resetCombo();
          flashDamage();
          playPlayerDamageSound();
          updateHud();
          if (lives <= 0) {
            endGame();
          }
        }

        init();
      })();
    </script>
  </body>
